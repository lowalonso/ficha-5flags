<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#131019">
<meta name="description" content="Fichas da Sociedade Sem Bandeiras — Cinco Estandartes em Chamas, Daggerheart. Estado, cartas, dados e anotações salvos no banco, ao vivo para a mesa toda.">
<title>A Sociedade Sem Bandeiras — Fichas da mesa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Spectral:ital,wght@0,300;0,400;0,600;1,300;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-database-compat.js"></script>
<style>
:root{
  --acc:#e0662f; --accd:#a8461b; --acc2:#f2a06a;
  --bg:#131019; --bg2:#0f0c14; --p:#1b1724; --p2:#231d2e; --p3:#2b2338;
  --line:#352c44; --line2:#57496b;
  --vico:var(--acc); --vico2:var(--acc2); --bone:#ece3d0; --dim:#b7ab93; --dim2:#8f846f;
  --hope:#e3b24c; --fear:#a98af0; --corr:#8a68d6; --corr2:#a98af0; --blood:#c04a53; --blood2:#e87a90; --arm:#6f8fb0; --fad:#d9803a;
  --ink:#0b090e; --perg:#ece3d0; --btxt:#fbf5ea; --tc:var(--line2);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--bone);font-family:'Spectral',Georgia,serif;font-size:16px;line-height:1.45;
  background-image:radial-gradient(ellipse 80% 38% at 50% 0%,color-mix(in srgb,var(--acc) 40%,transparent),transparent 70%),repeating-linear-gradient(135deg,rgba(255,255,255,.018) 0 2px,transparent 2px 9px);background-attachment:fixed;}
.w{max-width:1120px;margin:0 auto;padding:12px 12px 60px}
header{text-align:center;padding:8px 0 4px}
h1{font-family:'Cinzel','Trajan Pro',Georgia,serif;font-weight:400;font-size:clamp(2.1rem,7vw,3.6rem);letter-spacing:.02em;margin:0;line-height:1;color:var(--vico2);text-shadow:0 0 18px rgba(166,200,74,.25),0 2px 0 var(--ink)}
h1 em{font-style:normal;color:var(--corr2);text-shadow:0 0 18px rgba(180,91,224,.35),0 2px 0 var(--ink)}
.sub{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--dim2);margin:6px 0 10px}
.dbst{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim2);margin:-4px 0 8px}
.dbst.online{color:var(--vico)} .dbst.offline{color:var(--fad)} .dbst.conectando{color:var(--dim)}
.vine{display:block;width:min(420px,80%);height:14px;margin:0 auto 12px;opacity:.75}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px;margin-bottom:14px;position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 85%,transparent);padding:6px 0 10px}
@media(max-width:760px){.tabs{grid-template-columns:repeat(3,1fr);position:static;padding:0 0 4px}}
.tab{background:var(--p);border:1px solid var(--line);padding:9px 6px;cursor:pointer;text-align:center;transition:.12s;border-radius:2px;position:relative;overflow:hidden}
.tab:hover{border-color:var(--line2)}
.tab.sel{border-color:var(--vico);background:var(--p2);box-shadow:0 0 0 1px rgba(166,200,74,.25) inset,0 6px 18px rgba(0,0,0,.4)}
.tab.sel::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--vico),var(--corr))}
.tab b{display:block;font-family:'Cinzel','Trajan Pro',Georgia,serif;font-weight:400;font-size:19px;line-height:1.05;color:var(--bone)}
.tab span{display:block;font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab .hp{position:absolute;top:0;left:0;height:3px;background:var(--blood);transition:.3s}

/* layout */
.grid{display:grid;grid-template-columns:360px 1fr;gap:14px;align-items:start}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--p);border:1px solid var(--line);border-radius:3px;padding:14px 16px;position:relative}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:3px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
h2{font-family:'Cinzel','Trajan Pro',Georgia,serif;font-weight:400;font-size:21px;color:var(--vico2);margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:8px;letter-spacing:.02em}
h2 small{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim2);font-weight:400;text-align:right}

/* header block of sheet */
.hero{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.hero .nm{font-family:'Cinzel','Trajan Pro',Georgia,serif;font-size:44px;line-height:.95;color:var(--bone);font-weight:400}
.hero .cls{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--vico);margin-top:6px}
.hero .cls span{color:var(--dim2)}
.hero .con:empty::before{content:attr(data-ph);opacity:.55}
.hero .con{font-style:italic;color:var(--dim);margin-top:8px;font-size:15px;line-height:1.4}
.doms{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.chip{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:2px;border:1px solid;background:rgba(0,0,0,.25)}

/* stats */
.statbar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.st{background:var(--bg2);border:1px solid var(--line);padding:6px 4px 5px;text-align:center;border-radius:2px}
.st label{display:block;font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:8.5px;letter-spacing:.12em;color:var(--dim2);text-transform:uppercase}
.st input{width:100%;background:transparent;border:0;color:var(--vico2);font-family:'Cinzel','Trajan Pro',Georgia,serif;font-size:26px;line-height:1;text-align:center;padding:3px 0 0}
.st input:focus{outline:1px solid var(--vico)}
.st.big input{font-size:30px}
.thr{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:11px;color:var(--dim);display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-top:8px;text-align:center}
.thr div{border:1px solid var(--line);padding:5px 2px;background:rgba(0,0,0,.2)}
.thr b{display:block;color:var(--bone);font-size:12px}
.thr i{display:block;font-style:normal;color:var(--dim2);font-size:9px;letter-spacing:.08em;text-transform:uppercase}

.agrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.ab{background:var(--bg2);border:1px solid var(--line);padding:6px 4px;text-align:center;border-radius:2px;cursor:pointer;transition:.1s}
.ab:hover{border-color:var(--line2)}
.ab.sel{border-color:var(--hope);box-shadow:0 0 0 1px rgba(224,179,77,.3) inset}
.ab label{display:block;font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:8.5px;letter-spacing:.1em;color:var(--dim2);text-transform:uppercase;pointer-events:none}
.ab .row{display:flex;align-items:center;justify-content:center;gap:5px;margin-top:2px}
.ab .row button{width:22px;height:22px;border:1px solid var(--line);background:transparent;color:var(--dim);cursor:pointer;font-size:14px;line-height:1;border-radius:2px;padding:0}
.ab .row .v{font-family:'Cinzel','Trajan Pro',Georgia,serif;font-size:24px;color:var(--bone);min-width:34px;line-height:1}

/* trackers */
.trk{margin-bottom:11px}
.trk .lb{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.trk .lb b{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:500}
.trk .lb span{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:10.5px;color:var(--dim2)}
.pips{display:flex;gap:5px;flex-wrap:wrap}
.pip{width:28px;height:28px;border:1.5px solid var(--line2);background:var(--bg2);cursor:pointer;transition:.08s;border-radius:2px;position:relative}
.pip:hover{border-color:var(--bone)}
.pip:active{transform:scale(.88)}
.pip.on{background:var(--blood);border-color:var(--blood2)}
.pip.hope.on{background:var(--hope);border-color:#f3cf7a;box-shadow:0 0 8px rgba(224,179,77,.5)}
.pip.arm.on{background:var(--arm);border-color:#b8c8d6}
.pip.fad.on{background:var(--fad);border-color:#e6a862}
.pip.corr{border-radius:0;transform:rotate(45deg) scale(.78);border-color:#5a3f70}
.pip.corr:active{transform:rotate(45deg) scale(.7)}
.pip.corr.on{background:var(--corr);border-color:var(--corr2);box-shadow:0 0 12px rgba(180,91,224,.65)}
.pip.corr.on::after{content:"";position:absolute;inset:6px;background:var(--ink);opacity:.35;border-radius:50%}
.ctr{display:flex;align-items:center;gap:8px}
.ctr button{width:30px;height:30px;border:1px solid var(--line2);background:var(--bg2);color:var(--vico2);font-size:18px;cursor:pointer;border-radius:2px;line-height:1}
.ctr .v{font-family:'Cinzel','Trajan Pro',Georgia,serif;font-size:24px;color:var(--bone);min-width:34px;text-align:center;line-height:1}
.ctr .mx{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:10px;color:var(--dim2)}
.rec{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px dashed var(--line)}
.rec .nm{flex:1;font-size:14px;color:var(--dim)}
.rec .x{border:0;background:transparent;color:var(--dim2);cursor:pointer;font-size:14px;padding:2px 4px}
.rec .x:hover{color:var(--blood2)}

/* dice */
.dice{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.dice select,.dice input{font-size:14px;padding:7px 8px}
.roll{display:flex;gap:8px;margin-top:8px}
.roll button{flex:1;padding:11px;border:1px solid var(--vico);background:var(--acc);color:var(--p2);font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;border-radius:2px}
.roll button:active{transform:translateY(1px)}
.roll button.g{border-color:var(--line2);background:var(--bg2);color:var(--dim)}
.res{margin-top:10px;background:var(--bg2);border:1px solid var(--line);padding:10px 12px;border-radius:2px;display:none}
.res.on{display:block;animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.res .tot{font-family:'Cinzel','Trajan Pro',Georgia,serif;font-size:40px;line-height:1;text-align:center}
.res .tot.hope{color:var(--hope)} .res .tot.fear{color:var(--fear)} .res .tot.crit{color:var(--vico2)}
.res .lbl{text-align:center;font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;margin-top:2px}
.res .lbl.hope{color:var(--hope)} .res .lbl.fear{color:var(--fear)} .res .lbl.crit{color:var(--vico2)}
.res .det{text-align:center;font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:11px;color:var(--dim2);margin-top:6px}
.res .det b{color:var(--hope)} .res .det i{font-style:normal;color:var(--fear)}

/* forms */
label.fl{display:block;font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.14em;color:var(--dim2);text-transform:uppercase;margin:12px 0 4px}
input.tx,select,textarea{width:100%;background:var(--bg2);border:1px solid var(--line);padding:8px 10px;color:var(--bone);font-family:'Spectral',Georgia,serif;font-size:15px;border-radius:2px}
input.tx:focus,select:focus,textarea:focus{outline:none;border-color:var(--vico)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--dim2) 50%),linear-gradient(135deg,var(--dim2) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
textarea{min-height:80px;resize:vertical;line-height:1.5}
.eqinfo{background:rgba(0,0,0,.25);border-left:2px solid var(--vico);padding:7px 10px;margin-top:6px;font-size:13.5px;color:var(--dim);line-height:1.5}
.eqinfo b{color:var(--vico2)}
.lst .it{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.lst .it input{flex:1}
.lst .it input.n{max-width:64px;text-align:center;font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace}
.lst .it button{width:32px;height:34px;border:1px solid var(--line);background:var(--bg2);color:var(--dim2);cursor:pointer;flex-shrink:0;border-radius:2px}
.lst .it button:hover{color:var(--blood2);border-color:var(--blood)}
button.add{width:100%;padding:9px;border:1px dashed var(--line2);background:transparent;color:var(--dim);font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;margin-top:6px;border-radius:2px}
button.add:hover{border-color:var(--vico);color:var(--vico2)}

/* features */
.feat{border-left:2px solid var(--line2);padding:5px 0 5px 11px;margin:8px 0;position:relative}
.feat b{color:var(--vico2);font-size:14.5px}
.feat p{margin:2px 0 0;font-size:13.5px;color:var(--dim);line-height:1.5}
.feat .ed{position:absolute;right:0;top:2px;border:0;background:transparent;color:var(--dim2);cursor:pointer;font-size:12px;opacity:.5}
.feat:hover .ed{opacity:1}
.feat textarea{margin-top:4px;font-size:13.5px}
.feat .bts{display:flex;gap:6px;margin-top:6px}
.feat .bts button{flex:1;padding:6px;border:1px solid var(--line);background:var(--bg2);color:var(--dim);font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.feat .bts button.ok{border-color:var(--vico);color:var(--vico2)}
.feat .bts button.rm{color:var(--blood2)}
.feat.trans{border-color:var(--blood)}
.feat.trans b{color:var(--blood2)}

/* cards */
.cfilter{display:flex;gap:6px;margin-bottom:8px}
.cfilter button{flex:1;padding:7px;border:1px solid var(--line);background:var(--bg2);color:var(--dim);font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border-radius:2px}
.cfilter button.on{border-color:var(--vico);color:var(--vico2);background:var(--p2)}
.carta{background:var(--p2);border:1px solid var(--line);border-left-width:4px;padding:10px 12px;margin-bottom:8px;border-radius:2px;transition:.15s}
.carta.reserva{opacity:.55;background:var(--bg2)}
.carta .tg{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px}
.carta .tg span{color:var(--dim2)}
.carta b.nm{display:block;font-family:'Cinzel','Trajan Pro',Georgia,serif;font-weight:400;font-size:19px;margin:2px 0 3px;color:var(--bone);line-height:1.1}
.carta p{margin:0;font-size:13.5px;color:var(--dim);line-height:1.55}
.carta .bts{display:flex;gap:6px;margin-top:8px}
.carta .bts button{flex:1;padding:6px;border:1px solid var(--line);background:var(--bg2);color:var(--dim);font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border-radius:2px}
.carta .bts button.ok{border-color:var(--vico);color:var(--vico2)}
.carta .bts button.rm{color:var(--blood2)}
.carta .edg{display:grid;grid-template-columns:1fr 1fr 70px 70px;gap:6px;margin-bottom:6px}
@media(max-width:520px){.carta .edg{grid-template-columns:1fr 1fr}}
.carta .edg input,.carta .edg select{font-size:13px;padding:6px 8px}
.pick{max-height:420px;overflow-y:auto;border:1px solid var(--line);padding:8px;margin-top:6px;background:var(--bg2);border-radius:2px}
.pick .op{border:1px solid var(--line);border-left-width:4px;padding:8px 10px;margin-bottom:6px;cursor:pointer;border-radius:2px;background:var(--p)}
.pick .op:hover{border-color:var(--vico)}
.pick .op b{display:block;font-family:'Cinzel','Trajan Pro',Georgia,serif;font-weight:400;font-size:17px;color:var(--bone)}
.pick .op .tg{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim2)}
.pick .op p{margin:3px 0 0;font-size:12.5px;color:var(--dim);line-height:1.5}
.pickbar{display:grid;grid-template-columns:1fr auto;gap:6px;margin-top:8px}
.pickbar label{display:flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim2);white-space:nowrap}

/* rest */
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.acts button{flex:1;min-width:120px;padding:11px 8px;border:1px solid var(--vico);background:var(--acc);color:var(--p2);font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;border-radius:2px}
.acts button:active{transform:translateY(1px)}
.acts button.g{border-color:var(--line2);background:var(--bg2);color:var(--dim)}
.acts button.d{border-color:var(--blood);color:var(--blood2);background:var(--bg2)}
.rest{background:var(--bg2);border:1px solid var(--line);padding:10px 12px;margin-top:10px;border-radius:2px}
.rest .tt{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--vico);margin-bottom:8px}
.mv{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--p);padding:8px 10px;margin-bottom:6px;cursor:pointer;border-radius:2px}
.mv:hover{border-color:var(--line2)}
.mv.on{border-color:var(--vico);background:var(--p2)}
.mv .nm{flex:1;font-size:14px}
.mv .ef{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:10px;color:var(--dim2);letter-spacing:.04em}
.mv .cnt{font-family:'Cinzel','Trajan Pro',Georgia,serif;color:var(--vico2);min-width:22px;text-align:center;font-size:20px}
.log{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:11px;color:var(--vico2);background:rgba(0,0,0,.3);border-left:2px solid var(--vico);padding:8px 10px;margin-top:8px;line-height:1.6}
.hint{color:var(--dim2);font-size:12.5px;line-height:1.5;border:1px dashed var(--line);padding:8px 10px;margin-top:8px;border-radius:2px}
.hint b{color:var(--dim)}
.corrbox{border:1px solid #4a3560;background:linear-gradient(180deg,rgba(180,91,224,.08),transparent);padding:10px 12px;border-radius:2px;margin-top:4px}
.corrbox p{margin:6px 0 0;font-size:12.5px;color:var(--dim);line-height:1.5}

.nota{background:var(--p2);border:1px solid var(--line);border-left:3px solid var(--hope);padding:10px 12px;margin-top:8px;border-radius:2px}
.nota .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.nota .hd b{font-family:'Cinzel','Trajan Pro',Georgia,serif;font-weight:400;font-size:19px;color:var(--bone)}
.nota .hd span{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:10px;color:var(--dim2);letter-spacing:.08em}
.nota p{margin:4px 0 0;font-size:14px;color:var(--dim);line-height:1.55;white-space:pre-wrap}
.nota .bts{display:flex;gap:6px;margin-top:8px}
.nota .bts button{flex:1;padding:6px;border:1px solid var(--line);background:var(--bg2);color:var(--dim);font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border-radius:2px}
.nota .bts button.ok{border-color:var(--vico);color:var(--vico2)} .nota .bts button.rm{color:var(--blood2)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(10px);background:var(--ink);border:1px solid var(--vico);color:var(--vico2);padding:9px 18px;font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:0;pointer-events:none;transition:.25s;z-index:99;border-radius:2px}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

const CARDS={"Arcano":[{"n":"Proteção Rúnica","tipo":"Feitiço","lvl":1,"rec":0,"t":"Você tem um talismã pessoal que pode ser infundido com magia protetora e usado por você ou por um aliado. Descreva o que esse item é e por que ele é importante para você. O portador da proteção pode gastar 1 Ponto de Esperança para reduzir o dano sofrido em 1d8. Se tirar 8 nesse dado, o poder da Proteção Rúnica se encerra após reduzir dano neste turno. Ela pode ser recarregada sem custo no seu próximo descanso."},{"n":"Caos Liberto","tipo":"Feitiço","lvl":1,"rec":1,"t":"No início da sessão, coloque um número de marcadores igual ao seu atributo de conjuração nesta carta. Faça um teste de conjuração contra um alvo distante e gaste qualquer número de marcadores para canalizar energia bruta de seu interior e liberá-la contra ele. Em um sucesso, role uma quantidade de d10 igual ao número de marcadores que gastou e cause o resultado deles como dano mágico ao alvo. Marque 1 Ponto de Fadiga para recarregar esta carta com marcadores (até uma quantidade igual ao seu atributo de conjuração). No fim de cada sessão, marcadores não utilizados são perdidos."},{"n":"Caminhar na Parede","tipo":"Feitiço","lvl":1,"rec":1,"t":"Gaste 1 Ponto de Esperança: uma criatura tocada por você pode escalar paredes e tetos como se estivesse caminhando em terra firme. Esse efeito dura até o fim da cena ou até você conjurar Caminhar na Parede novamente."},{"n":"Incendiar","tipo":"Feitiço","lvl":2,"rec":1,"t":"Faça um teste de conjuração contra um alvo corpo a corpo. Em um sucesso, o alvo instantaneamente irrompe em chamas, sofre 1d20+3 de dano mágico e fica temporariamente Em Chamas. Quando uma criatura Em Chamas age, ela sofre 2d6 de dano mágico adicional se ainda estiver Em Chamas no fim da ação dela."},{"n":"Olho Flutuante","tipo":"Feitiço","lvl":2,"rec":0,"t":"Gaste 1 Ponto de Esperança para criar um pequeno orbe flutuante que você pode mover para um ponto qualquer em alcance muito distante. Enquanto este feitiço estiver ativo, você pode ver pelo orbe como se estivesse onde ele está. Você pode escolher entre usar seus próprios sentidos ou os do orbe como quiser. Se o orbe sofrer dano ou sair do alcance, o feitiço termina."},{"n":"Contramágica","tipo":"Feitiço","lvl":3,"rec":2,"t":"Você pode interromper um efeito mágico em andamento fazendo um teste de reação com seu atributo de conjuração. Em um sucesso, o efeito termina, quaisquer consequências são evitadas e esta carta vai para sua reserva."},{"n":"Voo","tipo":"Feitiço","lvl":3,"rec":1,"t":"Faça um teste de conjuração (15). Em um sucesso, coloque um número de marcadores igual à sua Agilidade nesta carta (mínimo de 1). Ao fazer um teste enquanto estiver voando, gaste um marcador desta carta. Após terminar a ação que consumiu o último marcador, você desce para o solo diretamente abaixo de você."},{"n":"Translocação","tipo":"Feitiço","lvl":4,"rec":1,"t":"Faça um teste de conjuração (12). Em um sucesso, gaste 1 Ponto de Esperança para se teleportar a um ponto que você possa ver em alcance distante. Se houver criaturas voluntárias Muito Próximas, gaste 1 Ponto de Esperança adicional para cada criatura que quiser levar consigo."},{"n":"Impacto Defensivo","tipo":"Feitiço","lvl":4,"rec":2,"t":"Faça um teste de conjuração contra todos os alvos corpo a corpo. Alvos atingidos são empurrados para um ponto qualquer em alcance distante e sofrem d8+3 de dano mágico usando seu atributo de conjuração."},{"n":"Corrente de Relâmpagos","tipo":"Feitiço","lvl":5,"rec":1,"t":"Marque 2 Pontos de Fadiga para fazer um teste de conjuração e liberar relâmpagos em cadeia contra todos os alvos próximos. Alvos atingidos devem fazer um teste de reação com Dificuldade igual ao resultado de seu teste de conjuração. Se falharem, sofrem 2d8+4 de dano mágico. Adversários adicionais que não tenham sido alvo da Corrente de Relâmpagos e estejam próximos dos alvos que sofreram dano também devem fazer um teste de reação. Se falharem, sofrem 2d8+4 de dano mágico. A corrente continua até não haver mais adversários no alcance."},{"n":"Premonição","tipo":"Feitiço","lvl":5,"rec":2,"t":"Você pode canalizar energia arcana para ter visões do futuro. Uma vez por descanso longo, imediatamente após o mestre apresentar as consequências de um teste que você fez, você pode ignorar esse movimento e suas consequências como se elas não tivessem acontecido e fazer outro movimento no lugar."},{"n":"Fenda Espacial","tipo":"Feitiço","lvl":6,"rec":2,"t":"Faça um teste de conjuração (15). Em um sucesso, você faz uma marca arcana no solo onde está no momento. Na próxima vez que você conjurar Fenda Espacial, abre-se um portal que fornece passagem segura para o ponto exato onde a marca foi colocada. A fenda permanece aberta até você fechá-la ou até conjurar outro feitiço. Você pode cancelar o feitiço a qualquer momento para conjurar Fenda Espacial novamente e marcar outro lugar."},{"n":"Telecinese","tipo":"Feitiço","lvl":6,"rec":0,"t":"Faça um teste de conjuração contra um alvo distante. Em um sucesso, você pode usar sua mente para movê-lo para um ponto qualquer em alcance distante relativo à posição inicial dele. Você também pode arremessá-lo como um ataque, fazendo um teste de conjuração adicional contra o alvo desse ataque. Em um sucesso, você causa d12+4 de dano físico ao segundo alvo com sua Proficiência. Depois disso, o feitiço acaba."},{"n":"Dom Arcano","tipo":"Feitiço","lvl":7,"rec":2,"t":"Se 4 ou mais cartas de domínio na sua mão pertencerem ao domínio Arcano, receba os seguintes benefícios: • Bônus de +1 em testes de conjuração; • Uma vez por descanso, você pode trocar os resultados dos Dados de Esperança e Medo um pelo outro."},{"n":"Ocultação","tipo":"Feitiço","lvl":7,"rec":2,"t":"Ao ter sucesso em um teste de conjuração para conjurar um feitiço diferente, você pode gastar 1 Ponto de Esperança para ficar Oculto. Enquanto estiver Oculto, quando um adversário se movimentar para um lugar de onde normalmente veria você, ele não pode vê-lo se você estiver parado. Ao entrar ou se movimentar dentro da linha de visão de um adversário, ou ao atacar, você deixa de estar Oculto."},{"n":"Reflexo Arcano","tipo":"Feitiço","lvl":8,"rec":1,"t":"Quando for sofrer dano mágico, você pode gastar qualquer quantidade de Pontos de Esperança e rolar um número equivalente de d6. Se tirar 6 em qualquer um desses dados, o ataque é refletido e, em vez de causar dano a você, causa dano ao atacante."},{"n":"Aura de Confusão","tipo":"Feitiço","lvl":8,"rec":2,"t":"Faça um teste de conjuração (14). Uma vez por descanso longo, em um sucesso, você cria uma camada ilusória sobre seu corpo, que torna difícil distinguir exatamente onde você está. Marque um número qualquer de Pontos de Fadiga e crie uma quantidade de camadas igual aos PF marcados. Quando um adversário ataca você, role um número de d6 igual à quantidade de camadas que tem no momento. Se tirar 5 ou mais em qualquer dado, uma camada da aura é destruída e o ataque falha. Se todos os resultados forem 4 ou menos, você sofre o dano e o feitiço termina."},{"n":"Terremoto","tipo":"Feitiço","lvl":9,"rec":2,"t":"Faça um teste de conjuração (16). Uma vez por descanso, em um sucesso, todos os alvos Muito distantes que não estiverem voando devem fazer um teste de reação (18). Quem falhar sofre 3d10+8 de dano físico e fica temporariamente Vulnerável. Quem passar sofre metade do dano. Além disso, quando você tem sucesso no teste de conjuração, o terreno dentro do alcance muito distante torna-se difícil e as estruturas dentro desse alcance podem ser danificadas ou desmoronar completamente."},{"n":"Projeção Sensorial","tipo":"Feitiço","lvl":9,"rec":0,"t":"Uma vez por descanso, faça um teste de conjuração (15). Em um sucesso, você entra numa visão que lhe permite ver e ouvir claramente qualquer lugar onde já esteve anteriormente, como se estivesse lá no momento. Você pode se mover livremente dentro da visão, sem sofrer as restrições físicas de ter um corpo material. Este feitiço não pode ser detectado por meios mágicos ou mundanos. Você sai da visão ao sofrer dano ou ao conjurar outra magia."},{"n":"Ajustar Realidade","tipo":"Feitiço","lvl":10,"rec":1,"t":"Quando você ou um aliado voluntário faz uma rolagem, você pode gastar 5 Pontos de Esperança para mudar o resultado para um à sua escolha — ele deve ser plausível dentro das possibilidades fornecidas pelos dados."},{"n":"Chuva Arcana","tipo":"Feitiço","lvl":10,"rec":1,"t":"Faça um teste de conjuração contra todos os adversários distantes. Marque uma quantidade qualquer de Pontos de Fadiga para fazer chover fragmentos arcanos. Alvos atingidos sofrem 1d20+2 de dano mágico para cada PF marcado."}],"Lâmina":[{"n":"Levante-se","tipo":"Talento","lvl":1,"rec":1,"t":"Ao sofrer dano grave, você pode marcar 1 Ponto de Fadiga para reduzir a gravidade em um limiar."},{"n":"Não o Suficiente","tipo":"Talento","lvl":1,"rec":1,"t":"Ao rolar dados de dano, você pode rolar novamente quaisquer resultados 1 ou 2."},{"n":"Turbilhão","tipo":"Talento","lvl":1,"rec":0,"t":"Quando acerta um ataque contra um alvo muito próximo, você pode gastar 1 Ponto de Esperança para usar este ataque contra todos os outros alvos muito próximos. Todos os adversários adicionais que você acertar ao usar este talento sofrem metade do dano."},{"n":"Fraternidade Marcial","tipo":"Talento","lvl":2,"rec":1,"t":"Uma vez por descanso longo, ao elogiar ou perguntar algo que alguém faz bem, vocês recebem 3 Pontos de Esperança."},{"n":"Ataque Imprudente","tipo":"Talento","lvl":2,"rec":1,"t":"Marque 1 Ponto de Fadiga para receber vantagem em um teste de ataque."},{"n":"Mexa-se","tipo":"Talento","lvl":3,"rec":1,"t":"Uma vez por descanso, quando uma criatura corpo a corpo for causar dano a você, você pode evitar o ataque e sair com segurança do alcance do inimigo."},{"n":"Versatilidade","tipo":"Talento","lvl":3,"rec":1,"t":"Em vez de usar o atributo requerido por uma arma equipada, você pode usar um atributo diferente. Ao causar dano, você pode marcar 1 Ponto de Fadiga para usar o valor máximo de um de seus dados de dano."},{"n":"Concentração Mortal","tipo":"Talento","lvl":4,"rec":2,"t":"Uma vez por descanso, você pode se concentrar totalmente em um alvo à sua escolha, recebendo um bônus de +1 em sua Proficiência. Esse bônus dura até você derrotar o alvo, atacar outra criatura ou a batalha terminar."},{"n":"Armadura Fortificada","tipo":"Talento","lvl":4,"rec":0,"t":"Você recebe um bônus de+2 nos seus limiares de dano enquanto estiver usando armadura."},{"n":"Vantagem do Campeão","tipo":"Talento","lvl":5,"rec":1,"t":"Ao ter sucesso crítico em um ataque, você pode gastar até 3 Pontos de Esperança e escolher uma das opções a seguir para cada Ponto de Esperança gasto dessa forma: • Você recupera 1 Ponto de Vida; • Você recupera 1 Ponto de Armadura; • O alvo deve marcar 1 PV adicional. Você não pode escolher a mesma opção mais de uma vez."},{"n":"Vitalidade","tipo":"Talento","lvl":5,"rec":0,"t":"Ao escolher esta carta, receba dois destes benefícios permanentemente: • 1 PF adicional; • 1 PV adicional; • Bônus de +2 em seus limiares de dano. Em seguida, coloque esta carta na sua reserva permanentemente."},{"n":"Calejado pela Batalha","tipo":"Talento","lvl":6,"rec":2,"t":"Uma vez por descanso longo, quando for fazer um movimento de morte, você pode gastar 1 Ponto de Esperança para, em vez disso, recuperar 1 PV."},{"n":"Fúria","tipo":"Talento","lvl":6,"rec":1,"t":"Antes de fazer um ataque, você pode marcar 1 Ponto de Fadiga para receber um bônus igual ao dobro de sua Força na rolagem de dano. Você pode ativar este talento duas vezes por ataque."},{"n":"Dom da Lâmina","tipo":"Talento","lvl":7,"rec":1,"t":"Se 4 ou mais cartas de domínio na sua mão pertencerem ao domínio da Lâmina, receba os seguintes benefícios: • Bônus de +2 em testes de ataque; • Bônus de +4 no seu limiar de dano grave."},{"n":"Golpe de Raspão","tipo":"Talento","lvl":7,"rec":1,"t":"Quando erra um ataque, você pode marcar 1 Ponto de Fadiga para causar o dano da arma usando metade de sua Proficiência."},{"n":"Grito de Guerra","tipo":"Talento","lvl":8,"rec":2,"t":"Uma vez por descanso longo, enquanto se lança rumo ao perigo, você pode emitir um grito de guerra que inspira seus aliados. Cada aliado capaz de ouvi-lo recupera 1 Ponto de Fadiga e ganha 1 Ponto de Esperança. Além disso, seus aliados fazem testes de ataque com vantagem até que você ou algum aliado role uma falha com Medo."},{"n":"Frenesi","tipo":"Talento","lvl":8,"rec":3,"t":"Uma vez por descanso longo, você pode entrar Em Frenesi até que não haja mais adversários na sua linha de visão. Enquanto estiver Em Frenesi, você não pode usar PA, ganha um bônus de +10 em rolagens de dano e um bônus de +8 no seu limiar de dano grave."},{"n":"Guerra e Glória","tipo":"Talento","lvl":9,"rec":2,"t":"Em um sucesso crítico ao atacar com uma arma, receba 1 Ponto de Esperança adicional ou recupere 1 Ponto de Fadiga adicional. Além disso, ao causar dano suficiente para derrotar um inimigo, receba 1 Ponto de Esperança ou recupere 1 PF."},{"n":"Golpe da Morte","tipo":"Talento","lvl":9,"rec":3,"t":"Uma vez por descanso longo, gaste 1 Ponto de Esperança para fazer um teste de ataque. O mestre informa contra quais alvos no alcance da arma o teste teria sucesso. Escolha um desses alvos e force-o a marcar 5 PV."},{"n":"Monstro de Batalha","tipo":"Talento","lvl":10,"rec":0,"t":"Ao acertar um ataque contra um adversário, em vez de rolar o dano, você pode marcar 4 Pontos de Fadiga para forçar o alvo a marcar um número de PV igual ao número de PV que você tem marcados no momento."},{"n":"Massacrar","tipo":"Talento","lvl":10,"rec":3,"t":"Ao acertar um ataque com sua arma, você nunca causa dano abaixo do limiar de dano maior do alvo (ele sempre marca no mínimo 2 Pontos de Vida). Além disso, quando uma criatura no alcance da sua arma causa dano a um aliado com um ataque que não tem você como alvo, você pode marcar 1 PF para forçá-la a fazer um teste de reação (15). Se falhar, o alvo deve marcar 1 Ponto de Vida."}],"Falange":[{"n":"Movimento Ligeiro","tipo":"Talento","lvl":1,"rec":0,"t":"Uma vez por descanso, marque 1 PF para se deslocar para qualquer lugar em alcance distante sem precisar de um teste de Agilidade. Se terminar esse movimento em alcance corpo a corpo de um adversário e imediatamente atacá-lo, você ganha um bônus de +1 no teste de ataque."},{"n":"Um Passo à Frente","tipo":"Talento","lvl":1,"rec":1,"t":"Quando você é alvo de um ataque originado de um ponto fora de alcance corpo a corpo, você pode marcar 1 Ponto de Fadiga para rolar 1d4 e receber um bônus igual ao resultado na sua Evasão contra este ataque."},{"n":"Intocável","tipo":"Talento","lvl":1,"rec":1,"t":"Receba um bônus na Evasão igual à metade da sua Agilidade."},{"n":"Ferocidade","tipo":"Talento","lvl":2,"rec":2,"t":"Ao fazer com que um adversário marque 1 ou mais Pontos de Vida, você pode gastar 2 Pontos de Esperança para aumentar sua Evasão em um número igual à quantidade de PV que ele marcou. Esse bônus dura até o término do próximo ataque feito contra você."},{"n":"Aproximação Estratégica","tipo":"Talento","lvl":2,"rec":1,"t":"Após um descanso longo, coloque um número de marcadores igual ao seu Conhecimento nesta carta (mínimo de 1). Na primeira vez que você se mover para ficar próximo de um adversário e atacá-lo, você pode gastar um marcador para escolher uma das opções abaixo: • Você faz o ataque com vantagem; • Você recupera 1 Ponto de Fadiga de um aliado cac ao adversário; • Você soma 1d8 à rolagem de dano. Após um descanso longo, marcadores não utilizados são perdidos."},{"n":"Resistir","tipo":"Talento","lvl":3,"rec":1,"t":"Ao marcar 1 Ponto de Armadura para reduzir o dano sofrido, você pode marcar 1 Ponto de Fadiga para marcar 1 Ponto de Armadura adicional."},{"n":"Táticas","tipo":"Talento","lvl":3,"rec":1,"t":"Ao prestar ajuda a um aliado, você pode gastar 1 Ponto de Esperança para somar uma de suas Experiências à rolagem, junto ao seu dado de vantagem. Ao fazer um teste em dupla, você pode usar 1d20 como seu Dado de Esperança."},{"n":"Impulso","tipo":"Talento","lvl":4,"rec":1,"t":"Marque 1 Ponto de Fadiga para usar um aliado próximo voluntário como impulso para se lançar no ar e fazer um ataque aéreo contra um alvo distante. Você tem vantagem no ataque, soma 1d10 à rolagem de dano e termina seu movimento corpo a corpo ao alvo."},{"n":"Redirecionar","tipo":"Talento","lvl":4,"rec":1,"t":"Quando um ataque originado de um ponto além do alcance corpo a corpo falha contra você, role um número de d6 igual à sua Proficiência. Se tirar 6 em qualquer dado, você pode marcar 1 Ponto de Fadiga para redirecionar o ataque, fazendo-o causar dano a um adversário muito próximo."},{"n":"Conhece Teu Inimigo","tipo":"Talento","lvl":5,"rec":1,"t":"Enquanto estiver observando uma criatura, você pode fazer um teste de Instinto contra ela. Em um sucesso, gaste 1 Ponto de Esperança e pergunte ao mestre uma das seguintes informações a respeito dela: • PV e PF restantes; • Dificuldade e limiares de dano; • Táticas e dados de dano padrão; • Habilidades e Experiências. Além disso, em um sucesso, você pode marcar 1 PF para fazer o mestre perder 1 Ponto de Medo."},{"n":"Golpe Pessoal","tipo":"Talento","lvl":5,"rec":1,"t":"Você tem um golpe icônico de combate. Descreva-o e dê um nome a ele. Uma vez por descanso, ao utilizá-lo como parte de uma ação, você pode rolar 1d20 como seu Dado de Esperança. Em um sucesso, recupere 1 Ponto de Fadiga."},{"n":"Contra-Ataque Rápido","tipo":"Talento","lvl":6,"rec":0,"t":"Quando um ataque originado de um ponto em alcance corpo a corpo falha contra você, você pode marcar 1 Ponto de Fadiga e aproveitar a oportunidade para causar o dano de uma de suas armas ativas ao atacante."},{"n":"Recuperação","tipo":"Talento","lvl":6,"rec":1,"t":"Durante um descanso curto, você pode escolher um movimento de repouso de descanso longo. Você pode gastar 1 Ponto de Esperança para permitir que um aliado também faça isso."},{"n":"Dom da Falange","tipo":"Talento","lvl":7,"rec":2,"t":"Se 4 ou mais cartas de domínio na sua mão pertencerem ao domínio da Falange, receba os seguintes benefícios: • Bônus de +1 na Agilidade; • Uma vez por descanso, você pode gastar 3 Pontos de Esperança para fazer com que um ataque bem-sucedido contra você falhe."},{"n":"Acuidade Cruel","tipo":"Talento","lvl":7,"rec":1,"t":"Ao acertar um ataque com uma arma, receba um bônus igual à sua Acuidade ou Agilidade na rolagem de dano."},{"n":"Golpe Debilitante","tipo":"Talento","lvl":8,"rec":3,"t":"Ao acertar um ataque, você pode marcar 1 PF para fazer com que o próximo ataque bem-sucedido contra o mesmo alvo cause 2d12 de dano adicional."},{"n":"Amontoar","tipo":"Talento","lvl":8,"rec":1,"t":"Faça um teste de Agilidade contra todos os alvos próximos. Gaste 1 Ponto de Esperança para mover os alvos que você acerta, bem como quaisquer aliados próximos voluntários, para outro ponto em alcance próximo."},{"n":"Quase Lá","tipo":"Talento","lvl":9,"rec":1,"t":"Se tiver 2 PVou menos desmarcados, você não sofre dano menor."},{"n":"Ataque Fragmentado","tipo":"Talento","lvl":9,"rec":3,"t":"Gaste 1 Ponto de Esperança e faça um ataque contra todos os adversários no alcance de sua arma. Uma vez por descanso longo, em um sucesso contra qualquer um dos alvos, some todo o dano causado e em seguida o redistribua como quiser entre os alvos atingidos. Antes de causar dano a um alvo, role um dado de dano adicional e some o resultado dele ao dano que causar ao alvo."},{"n":"Trajeto Mortal","tipo":"Talento","lvl":10,"rec":1,"t":"Gaste 3 Pontos de Esperança para percorrer o campo de batalha em linha reta até um ponto em alcance distante, fazendo um ataque contra todos os adversários no alcance da sua arma ao longo do caminho percorrido. Escolha a ordem na qual o dano é causado aos alvos atingidos. Para o primeiro alvo, role o dano de sua arma com +1 de bônus na Proficiência. Depois disso, remova um dado do teste de dano e cause o dano restante ao próximo alvo. Continue removendo um dado para cada alvo subsequente até que não tenha mais dados de dano ou adversários. Você não pode escolher o mesmo alvo mais de uma vez por ataque."},{"n":"Passo Célere","tipo":"Talento","lvl":10,"rec":2,"t":"Quando um ataque falha contra você, recupere 1 Ponto de Fadiga. Se não puder recuperar PF, receba 1 Ponto de Esperança."}],"Códice":[{"n":"Livro de Ava","tipo":"Grimório","lvl":1,"rec":2,"t":"Propelir: faça um teste de conjuração contra um alvo corpo a corpo. Em um sucesso, ele é empurrado para um ponto em alcance distante e sofre d10+2 de dano mágico com sua Proficiência. Armadura de Tava: gaste 1 Ponto de Esperança para conceder um bônus de +1 na Armadura a um alvo que você possa tocar. Esse bônus dura até o próximo descanso do alvo ou até que você conjure Armadura de Tava novamente. Estaca de Gelo: faça um teste de conjuração (12) para invocar um grande espinho de gelo em alcance distante. Se usá-lo como arma, em vez disso, faça o teste de conjuração contra a Dificuldade do alvo. Em um sucesso, você causa d6 de dano físico usando sua Proficiência."},{"n":"Livro de Illiat","tipo":"Grimório","lvl":1,"rec":2,"t":"Sonolência: faça um teste de conjuração contra um alvo muito próximo. Em um sucesso, ele fica Adormecido até sofrer dano ou até o mestre gastar 1 Ponto de Medo no turno dele para encerrar a condição. Saraivada Arcana: uma vez por descanso, gaste qualquer quantidade de Pontos de Esperança para atirar projéteis mágicos que acertam um alvo próximo à sua escolha. Role um número de d6 igual à quantidade de Pontos de Esperança gasta e cause o resultado deles como dano mágico ao alvo. Telepatia: gaste 1 Ponto de Esperança para criar uma linha de comunicação mental com um alvo que você possa ver. Essa conexão dura até seu próximo descanso ou até você conjurar Telepatia novamente."},{"n":"Livro de Tyfar","tipo":"Grimório","lvl":1,"rec":2,"t":"Chama Selvagem: faça um teste de conjuração contra até três adversários corpo a corpo. Chamas irrompem de sua mão. Alvos atingidos sofrem 2d6 de dano mágico e marcam 1 Ponto de Fadiga. Mão Arcana: você conjura uma mão mágica idêntica à sua em força e tamanho num ponto em alcance distante. Névoa Misteriosa: faça um teste de conjuração (13) para conjurar uma névoa densa que fica em uma área estática dentro do alcance muito próximo. A neblina deixa essa área e tudo o que há nela fortemente obscurecido."},{"n":"Livro de Sitil","tipo":"Grimório","lvl":2,"rec":2,"t":"Ajustar Aparência: você muda magicamente sua aparência e vestimentas para evitar ser reconhecido. Paralelos:gaste 2 Pontos de Esperança para conjurar este feitiço sobre si mesmo ou sobre um aliado próximo. Na próxima vez que o alvo fizer um ataque, ele pode acertar um alvo adicional dentro do alcance contra o qual seu teste de ataque seria bem-sucedido. Você pode manter este feitiço ativo sobre uma única criatura por vez. Ilusão: faça um teste de conjuração (14). Em um sucesso, você cria uma ilusão visual temporária em um ponto em alcance próximo. Ela não pode ultrapassar seu tamanho e dura enquanto você olhar para ela. A ilusão não levanta suspeitas até um observador estar corpo a corpo dela."},{"n":"Livro de Vagras","tipo":"Grimório","lvl":2,"rec":2,"t":"Portal Arcano: se não houver adversários corpo a corpo, faça um teste de conjuração (13). Em um sucesso, gaste 1 Ponto de Esperança para criar um portal de onde você está para outro ponto que você possa ver em alcance distante. Ele se fecha depois que uma criatura passar por ele. Revelar: faça um teste de conjuração. Se houver algo escondido por magia em alcance próximo, ela é revelada. Tranca Rúnica: faça um teste de conjuração (15) sobre um objeto que esteja tocando e que possa fechar (como um baú, cadeado, caixa ou fechadura). Uma vez por descanso, em um sucesso, você pode trancar o objeto de modo que ele só possa ser aberto por criaturas designadas por você. Este feitiço pode ser quebrado em uma hora por uma pessoa com acesso à magia."},{"n":"Livro de Korvax","tipo":"Grimório","lvl":3,"rec":2,"t":"Círculo Rúnico:marque 1 Ponto de Fadiga para criar um círculo mágico temporário abaixo de onde você está. Todos os adversários que entrarem ou estiverem em alcance cac sofrem 2d12+4 de dano mágico e são empurrados para um ponto em alcance muito próximo. Lapso:gaste 1 Ponto de Esperança para forçar um alvo corpo a corpo a fazer um teste de reação (15). Se falhar, ele esquece o último minuto de conversa com você. Levitação: faça um teste de conjuração para suspender temporariamente no ar um alvo que você possa ver e movê-lo para um ponto em alcance próximo relativo à posição original dele."},{"n":"Livro de Norai","tipo":"Grimório","lvl":3,"rec":2,"t":"Amarração Mística: faça um teste de conjuração contra um alvo distante. Em um sucesso, ele fica temporariamente Imobilizado e deve marcar 1 Ponto de Fadiga. Se tiver uma criatura que esteja voando como alvo, este feitiço faz com que ela aterrisse e fique temporariamente Imobilizada. Bola de Fogo: faça um teste de conjuração contra um alvo muito distante. Em um sucesso, lance uma esfera de fogo que explode ao se chocar contra ele. O alvo e todas as criaturas Muito Próximas dele devem fazer um teste de reação (13). Alvos que falharem sofrem d20+5 de dano mágico com sua Proficiência. Alvos bem-sucedidos sofrem metade do dano."},{"n":"Livro de Ecsota","tipo":"Grimório","lvl":4,"rec":3,"t":"Criar Construto:gaste 1 Ponto de Esperança para escolher um grupo de objetos ao seu redor e, a partir deles, crie um construto animado que obedece comandos básicos. Faça um teste de conjuração para mandá-lo agir. Quando necessário, ele compartilha sua Evasão e atributos, e os ataques dele causam 2d10+3 de dano físico. Você pode manter apenas um construto por vez, e ele se desfaz ao sofrer qualquer quantidade de dano. Repudiar: você pode interromper um efeito mágico em andamento. Faça um teste de conjuração usando seu atributo de conjuração. Se passar, uma vez por descanso, o efeito cessa e quaisquer consequências são evitadas."},{"n":"Livro de Grynn","tipo":"Grimório","lvl":4,"rec":2,"t":"Deflexão: uma vez por descanso longo, gaste 1 Ponto de Esperança para negar o dano de um ataque que tenha você ou um aliado muito próximo como alvo. Muralha de Fogo: faça um teste de conjuração (15). Em um sucesso, crie uma muralha de fogo mágico entre dois pontos em alcance distante. Todas as criaturas no caminho dela devem escolher ficar em um dos lados, e tudo o que atravessá-la depois disso sofre 4d10+3 de dano mágico. Tranca Temporal: escolha um objeto distante como alvo. Esse objeto para no tempo e espaço exatamente onde está até o seu próximo descanso. Se uma criatura tentar movê-lo, faça um teste de conjuração contra ela para sustentar este feitiço."},{"n":"Muralha","tipo":"Feitiço","lvl":5,"rec":2,"t":"Faça um teste de conjuração (15). Em um sucesso, gaste 1 Ponto de Esperança uma vez por descanso para criar uma parede mágica temporária entre dois pontos em alcance distante. Ela pode ter até 15m de altura e se formar em qualquer ângulo. Criaturas ou objetos no caminho dela são desviados para um dos lados à sua escolha. A muralha perdura até seu próximo descanso ou até você conjurar Muralha novamente."},{"n":"Teleporte","tipo":"Grimório","lvl":5,"rec":2,"t":"Uma vez por descanso longo, você pode instantaneamente teleportar a si mesmo e qualquer número de alvos próximos voluntários para um lugar onde você já esteve anteriormente. Escolha uma das opções a seguir e faça um teste de conjuração (16): • Se conhece o lugar muito bem, receba +3 de bônus; • Se visitou o lugar com alguma frequência, receba +1 de bônus; • Se não visitou o lugar com frequência, você não ganha um modificador; • Se visitou o lugar apenas uma vez, sofra uma penalidade de –2. Em um sucesso, você aparece no lugar pretendido. Se falhar, você aparece em um lugar diferente do pretendido. O grau da falha determina quão longe você aparece."},{"n":"Banir","tipo":"Feitiço","lvl":6,"rec":0,"t":"Faça um teste de conjuração contra um alvo próximo. Em um sucesso, role um número de d20 igual ao seu atributo de conjuração. O alvo deve fazer um teste de reação com Dificuldade igual ao seu resultado mais alto. Em um sucesso, o alvo marca 1 Ponto de Fadiga, mas não é banido. Uma vez por descanso, se falhar, ele é banido deste reino. Quando os personagens rolarem com Medo, a Dificuldade sofre uma penalidade de –1 e o alvo faz outro teste de reação. Em um sucesso, ele volta do banimento."},{"n":"Sigilo da Retaliação","tipo":"Feitiço","lvl":6,"rec":2,"t":"Marque um adversário próximo com um Sigilo da Retaliação. O mestre ganha 1 Ponto de Medo. Quando o adversário marcado causar dano a você ou aos seus aliados, coloque 1d8 nesta carta. Você pode acumular um número de d8 igual ao seu nível. Ao atacar o adversário marcado com sucesso, role os dados que estão nesta carta e some o total à sua rolagem de dano; em seguida, retire os dados. Este efeito termina quando o adversário marcado é derrotado ou quando você conjura Sigilo da Retaliação novamente."},{"n":"Livro de Homet","tipo":"Grimório","lvl":7,"rec":0,"t":"Atravessar: faça um teste de conjuração (13). Uma vez por descanso, em um sucesso, você e todas as criaturas que o estejam tocando podem atravessar uma parede ou porta Próxima. O efeito termina quando todos estiverem do outro lado. Portal Planar: faça um teste de conjuração (14). Uma vez por descanso longo, em um sucesso, abra um portal para uma localidade que você já tenha visitado em outra dimensão ou plano de existência. Esse portal perdura até seu próximo descanso."},{"n":"Dom do Códice","tipo":"Talento","lvl":7,"rec":2,"t":"Se 4 ou mais cartas de domínio na sua mão pertencerem ao domínio do Códice, receba os seguintes benefícios: • Você pode marcar 1 Ponto de Fadiga para somar sua Proficiência a um teste de conjuração; • Uma vez por descanso, substitua esta carta por qualquer carta em sua reserva sem pagar o custo de troca."},{"n":"Livro de Vyola","tipo":"Grimório","lvl":8,"rec":2,"t":"Clareza Compartilhada: uma vez por descanso longo, gaste 1 Ponto de Esperança para escolher duas criaturas voluntárias. Quando uma delas for marcar PF, ela pode escolher qual das duas irá marcar. Este feitiço dura até o próximo descanso dos alvos. Sondar Memórias: faça um teste de conjuração contra um alvo distante. Em um sucesso, espione a mente do alvo e faça uma pergunta ao mestre. O mestre descreve as memórias do alvo que estejam relacionadas à resposta."},{"n":"Refúgio Seguro","tipo":"Feitiço","lvl":8,"rec":3,"t":"Quando tem alguns minutos de calma para se concentrar, você pode gastar 2 Pontos de Esperança para invocar seu Refúgio Seguro: um grande abrigo interdimensional onde você e seus aliados podem ficar. Ao fazer isso, uma porta mágica aparece em algum lugar em alcance próximo. Apenas criaturas designadas por você podem entrar. Após entrar, você pode deixar a entrada invisível. Qualquer pessoa no interior do refúgio pode sair a hora que quiser. Depois que você sair, a porta de entrada deve ser invocada novamente. Ao fazer um descanso em seu Refúgio Seguro, você pode escolher um movimento de repouso adicional."},{"n":"Livro de Ronin","tipo":"Grimório","lvl":9,"rec":4,"t":"Enervação Eterna: uma vez por descanso longo, faça um teste de conjuração contra um alvo próximo. Em um sucesso, ele fica permanentemente Vulnerável. O alvo não pode se recuperar dessa condição por quaisquer meios. Transformação: faça um teste de conjuração (15). Em um sucesso, transforme-se em um objeto inanimado que não exceda o dobro de seu tamanho normal. Você pode permanecer nessa forma até sofrer dano."},{"n":"Onda Desintegradora","tipo":"Feitiço","lvl":9,"rec":4,"t":"Faça um teste de conjuração (18).Uma vez por descanso longo, em um sucesso, o mestre lhe informa quais adversários distantes têm Dificuldade 18ou menor. Marque 1 Ponto de Fadiga para cada alvo que quiser atingir com este feitiço. O alvo morre e não pode voltar à vida por quaisquer meios."},{"n":"Livro de Yarrow","tipo":"Grimório","lvl":10,"rec":2,"t":"Imunidade Mágica: gaste 5 Pontos de Esperança para ficar imune a dano mágico até seu próximo descanso. Manipulação Temporal: faça um teste de conjuração (18). Em um sucesso, o tempo desacelera temporariamente até parar para todos que estiverem em alcance distante, com exceção de você. Ele volta ao normal na próxima vez que você fizer um teste que tenha outra criatura como alvo."},{"n":"União Transcendental","tipo":"Feitiço","lvl":10,"rec":1,"t":"Uma vez por descanso longo, gaste 5 Pontos de Esperança para conjurar este feitiço sobre duas ou mais criaturas voluntárias. Até seu próximo descanso, quando uma criatura conectada por essa união for marcar Pontos de Vida ou Pontos de Fadiga, as criaturas conectadas podem escolher qual delas marcará."}],"Graça":[{"n":"Dissimulação","tipo":"Talento","lvl":1,"rec":0,"t":"Gaste 1 Ponto de Esperança para receber vantagem em um teste para enganar ou fazer alguém acreditar em uma mentira que você contar."},{"n":"Enfeitiçar","tipo":"Feitiço","lvl":1,"rec":0,"t":"Faça um teste de conjuração contra um alvo próximo. Em um sucesso, ele fica temporariamente Enfeitiçado. Enquanto estiver Enfeitiçado, a atenção do alvo se fixa em você. O campo de visão dele se estreita e todos os sons além da sua voz são abafados. Uma vez por descanso, você pode marcar 1 Ponto de Fadiga para forçar o alvo Enfeitiçado a marcar 1 PF também."},{"n":"Palavras Inspiradoras","tipo":"Talento","lvl":1,"rec":1,"t":"Suas palavras são imbuídas de poder. Após um descanso longo, coloque um número de marcadores igual à sua Presença nesta carta. Ao falar com um aliado, você pode gastar um marcador desta carta para dar a ele um benefício dentre os seguintes: • Seu aliado recupera 1 PF; • Seu aliado recupera 1 PV; • Seu aliado ganha 1 Ponto de Esperança. Após um descanso longo, marcadores não utilizados são perdidos."},{"n":"Não Minta para Mim","tipo":"Feitiço","lvl":2,"rec":1,"t":"Faça um teste de conjuração contra um alvo muito próximo. Em um sucesso, ele não pode mentir para você enquanto estiver em alcance próximo, porém não é obrigado a falar. Se você fizer uma pergunta e ele se recusar a responder, ele deve marcar 1 Ponto de Fadiga e o efeito termina. O alvo em geral não está ciente de que este feitiço foi conjurado sobre ele até que fale uma verdade contra sua vontade."},{"n":"Insolência","tipo":"Talento","lvl":2,"rec":2,"t":"Ao insultar ou provocar um alvo distante, faça um teste de Presença contra ele. Uma vez por descanso, em um sucesso, role um número de d4 igual à sua Proficiência. O alvo deve marcar um número de Pontos de Fadiga igual ao maior resultado obtido."},{"n":"Lampejo Hipnótico","tipo":"Feitiço","lvl":3,"rec":1,"t":"Faça um teste de conjuração contra todos os adversários próximos na sua frente. Uma vez por descanso, em um sucesso, crie lampejos ilusórios de cores e luzes que deixam os alvos atingidos temporariamente Atordoados e os força a marcar 1 PF. Enquanto estiverem Atordoados, os alvos não podem usar reações e não podem fazer quaisquer outras ações até que se recuperem desta condição."},{"n":"Invisibilidade","tipo":"Feitiço","lvl":3,"rec":1,"t":"Faça um teste de conjuração (10). Em um sucesso, marque 1 Ponto de Fadiga e deixe você ou um aliado corpo a corpo Invisível. Uma criatura Invisível só pode ser vista por meios mágicos e testes de ataque contra ela são feitos com desvantagem. Coloque um número de marcadores igual ao seu atributo de conjuração nesta carta. Quando a criatura Invisível faz uma ação, gaste um marcador desta carta. Após o término da ação que consumiu o último marcador, o efeito termina. Você pode manter apenas uma criatura sob efeito de Invisibilidade por vez."},{"n":"Palavras Tranquilizantes","tipo":"Talento","lvl":4,"rec":1,"t":"Durante um descanso curto, ao passar um tempo amparando outro personagem por meio do movimento de repouso Tratar Ferimentos, recupere 1 Ponto de Vida adicional desse personagem. Ao fazer isso, você também recupera 2 Pontos de Vida."},{"n":"Espionar","tipo":"Feitiço","lvl":4,"rec":1,"t":"Escolha um alvo muito distante. Você pode ver e ouvir pelos olhos e ouvidos dele. Você pode escolher entre usar seus próprios sentidos ou os do alvo à vontade até seu próximo descanso ou até você conjurar outro feitiço."},{"n":"Sondar Pensamentos","tipo":"Feitiço","lvl":5,"rec":2,"t":"Você pode espionar a mente dos outros. Gaste 1 Ponto de Esperança para ler pensamentos vagos e superficiais de um alvo distante. Faça um teste de conjuração contra o alvo para sondar pensamentos profundos e escondidos. Se rolar com Medo, a critério do mestre, o alvo pode perceber que você está lendo a mente dele."},{"n":"Palavras de Discórdia","tipo":"Feitiço","lvl":5,"rec":1,"t":"Sussurre palavras de discórdia para um adversário corpo a corpo e faça um teste de conjuração (13). Em um sucesso, o alvo deve marcar 1 Ponto de Fadiga e atacar outro adversário em vez de você ou seus aliados. Após concluir o ataque, o alvo percebe o que aconteceu. Na próxima vez que conjurar Palavras de Discórdia sobre ele, você sofre uma penalidade de –5 no teste de conjuração."},{"n":"Jamais esquecido","tipo":"Talento","lvl":6,"rec":2,"t":"Ao marcar 1 ou mais Pontos de Vida devido a um ataque, você pode marcar 1 Ponto de Fadiga para colocar um número de marcadores nesta carta igual ao número de PV marcados. Para cada marcador nesta carta, você recebe um bônus de +5 na rolagem de dano do próximo ataque que você acertar. Em seguida, zere todos os marcadores."},{"n":"Partilhar o Fardo","tipo":"Feitiço","lvl":6,"rec":0,"t":"Uma vez por descanso, absorva a Fadiga de uma criatura corpo a corpo voluntária. O alvo descreve quais conhecimentos ou emoções particulares são transferidos da mente dele para a sua. Transfira qualquer número de PF do alvo para você e em seguida receba 1 Ponto de Esperança para cada PF transferido."},{"n":"Carisma Infinito","tipo":"Talento","lvl":7,"rec":1,"t":"Após fazer um teste para obter favores, mentir ou persuadir, você pode gastar 1 Ponto de Esperança para rolar novamente seu Dado de Esperança ou Medo."},{"n":"Dom da Graça","tipo":"Talento","lvl":7,"rec":2,"t":"Se 4 ou mais cartas de domínio na sua mão pertencerem ao domínio da Graça, receba os seguintes benefícios: • Você pode marcar 1 PA em vez de 1 PF; • Quando for fazer com que um alvo marque PV, você pode forçá-lo a marcar um número equivalente de PF em vez disso."},{"n":"Projeção Astral","tipo":"Feitiço","lvl":8,"rec":0,"t":"Uma vez por descanso longo, marque 1 Ponto de Fadiga para projetar uma cópia de si mesmo que pode aparecer em qualquer lugar no qual você já tenha estado anteriormente. Você pode ver e ouvir através da projeção e pode afetar o mundo como se você estivesse no lugar dela. Uma criatura que investigue a projeção pode discernir sua origem mágica. Esse efeito dura até seu próximo descanso ou até sua projeção sofrer qualquer dano."},{"n":"Enfeitiçar em Massa","tipo":"Feitiço","lvl":8,"rec":3,"t":"Faça um teste de conjuração contra todos os alvos distantes. Alvos atingidos ficam temporariamente Enfeitiçados. Enquanto um alvo estiver Enfeitiçado, a atenção dele se fixa em você. O campo de visão dele se estreita e todos os sons além da sua voz são abafados. Marque 1 Ponto de Fadiga para forçar todos os alvos Enfeitiçados a marcarem 1 PF, encerrando este feitiço."},{"n":"Imitador","tipo":"Feitiço","lvl":9,"rec":3,"t":"Uma vez por descanso longo, esta carta pode imitar as habilidades de outra carta de domínio de 8º nível ou menor na mão de outro jogador. Gaste uma quantidade de Esperança igual à metade do nível da carta para ter acesso à habilidade. A cópia permanece até seu próximo descanso ou até o outro jogador colocar a carta original na reserva."},{"n":"Mestre do Ofício","tipo":"Talento","lvl":9,"rec":0,"t":"Receba um bônus permanente de +2 em duas de suas Experiências, ou +3 em apenas uma. Em seguida, coloque esta carta na sua reserva permanentemente."},{"n":"Em Dobro","tipo":"Feitiço","lvl":10,"rec":1,"t":"Quando um aliado próximo causa dano a um adversário, você pode fazer um teste de conjuração contra esse mesmo alvo. Em um sucesso, você causa o mesmo dano que seu aliado causou. Se você rolar um sucesso com Medo, coloque esta carta na reserva."},{"n":"Notoriedade","tipo":"Talento","lvl":10,"rec":0,"t":"As pessoas sabem quem você é e o que já fez; por isso, o tratam de forma diferente. Ao se aproveitar de sua notoriedade para conseguir o que quer, você pode marcar 1 Ponto de Fadiga antes do teste para receber um bônus de +10 no resultado. Onde quer que vá, você obtém comida e bebida grátis, e o preço das outras mercadorias que você compra diminui em uma bolsa de ouro (até o mínimo de um punhado). Esta carta não conta para o limite de 5 cartas de domínio na sua mão e não pode ser colocada na reserva."}],"Meia-noite":[{"n":"Delinquente","tipo":"Talento","lvl":1,"rec":0,"t":"Você tem vantagem em testes para arrombar fechaduras não mágicas, desarmar armadilhas não mágicas ou roubar itens de um alvo (seja por meio da furtividade ou da força)."},{"n":"Chuva de Lâminas","tipo":"Feitiço","lvl":1,"rec":1,"t":"Gaste 1 Ponto de Esperança para fazer um teste de conjuração e arremessar lâminas mágicas contra todos os alvos muito próximos. Alvos atingidos sofrem d8+2 de dano mágico com sua Proficiência. Se um alvo atingido estiver Vulnerável, ele sofre 1d8 de dano adicional."},{"n":"Disfarce Inquietante","tipo":"Feitiço","lvl":1,"rec":0,"t":"Quando tem alguns minutos para se preparar, você pode marcar 1 Ponto de Fadiga para tomar a forma de qualquer humanoide que você possa ver com clareza em sua mente. Enquanto estiver disfarçado dessa forma, você tem vantagem em testes de Presença para evitar ser descoberto. Coloque um número de marcadores igual ao seu atributo de conjuração nesta carta. Quando fizer uma ação enquanto estiver disfarçado, gaste um marcador. Após a ação que consumiu o último marcador, o efeito termina."},{"n":"Espírito da meia-noite","tipo":"Feitiço","lvl":2,"rec":1,"t":"Gaste 1 Ponto de Esperança para invocar um espírito de tamanho humanoide que pode se mover ou carregar coisas para você até seu próximo descanso. Você também pode mandá-lo atacar um adversário. Ao fazer isso, faça um teste de conjuração contra um alvo muito distante. Em um sucesso, o espírito se move até ficar corpo a corpo ao alvo. Role um número de d6 igual ao seu atributo de conjuração e cause o resultado deles como dano mágico ao alvo. O espírito então se dissipa. Você pode ter apenas um espírito por vez."},{"n":"Sombra Traiçoeira","tipo":"Feitiço","lvl":2,"rec":0,"t":"Faça um teste de conjuração contra todos os adversários muito próximos. Alvos atingidos ficam temporariamente Imobilizados pela própria sombra no lugar em que estão."},{"n":"Estrangulamento","tipo":"Talento","lvl":3,"rec":1,"t":"Quando se posiciona atrás de uma criatura de tamanho similar ao seu, você pode marcar 1 Ponto de Fadiga para estrangulá-la, deixando-a temporariamente Vulnerável. Quando uma criatura ataca um alvo Vulnerável dessa forma, ela causa 2d6 de dano adicional."},{"n":"Véu da Noite","tipo":"Feitiço","lvl":3,"rec":1,"t":"Faça um teste de conjuração (13). Em um sucesso, crie uma cortina de escuridão entre dois pontos em alcance distante. Apenas você pode enxergar através dessa escuridão. Você é considerado Escondido para adversários no outro lado da cortina e tem vantagem em testes de ataque feitos através da escuridão. A cortina dura até você conjurar outro feitiço."},{"n":"Mestre da Furtividade","tipo":"Talento","lvl":4,"rec":0,"t":"Ao rolar com Medo enquanto tenta se mover por uma área perigosa sem ser percebido, você pode marcar 1 PF para rolar com Esperança em vez disso. Se um aliado próximo também estiver tentando se mover sem ser percebido e rolar com Medo, você pode marcar 1 PF para mudar o resultado e fazê-lo rolar com Esperança."},{"n":"Glifo do Ocaso","tipo":"Feitiço","lvl":4,"rec":1,"t":"Faça um teste de conjuração contra um alvo muito próximo. Em um sucesso, gaste 1 Ponto de Esperança para conjurar um glifo sombrio sobre ele. O glifo expõe os pontos fracos do alvo, reduzindo temporariamente sua Dificuldade em um valor igual ao seu Conhecimento (mínimo de 1)."},{"n":"Silêncio","tipo":"Feitiço","lvl":5,"rec":1,"t":"Faça um teste de conjuração contra um alvo próximo. Em um sucesso, gaste 1 Ponto de Esperança para conjurar um efeito mágico supressor sobre o alvo. Esse efeito afeta tudo em alcance muito próximo do alvo e o acompanha quando ele se move. O alvo, e tudo mais na área afetada, fica Silenciado. Enquanto estiver Silenciado, o alvo não pode fazer barulho ou conjurar feitiços. Essa condição dura até o mestre gastar 1 Ponto de Medo no turno dele para encerrá-la, até você conjurar Silêncio novamente ou até você sofrer dano maior."},{"n":"Recuo Espectral","tipo":"Feitiço","lvl":5,"rec":2,"t":"Gaste 1 Ponto de Esperança para ativar Recuo Espectral no local onde você está. Gaste mais 1 Ponto de Esperança a qualquer momento antes de seu próximo descanso para desaparecer da sua localização atual e reaparecer no local onde estava quando ativou Recuo Espectral. Depois que você reaparecer, este feitiço termina."},{"n":"Sussurros Sombrios","tipo":"Feitiço","lvl":6,"rec":0,"t":"Você pode se comunicar mentalmente com qualquer pessoa com a qual tenha tido contato físico. Uma vez que tenha aberto um canal de comunicação com o alvo, ele pode se comunicar com você da mesma forma. Além disso, você pode marcar 1 Ponto de Fadiga para fazer um teste de conjuração contra ele. Em um sucesso, você pode fazer uma das seguintes perguntas, que deve ser respondida pelo mestre: • Onde a pessoa está? • O que ela está fazendo? • Do que ela tem medo? • Com o que ela mais se preocupa?"},{"n":"Disfarce em Massa","tipo":"Feitiço","lvl":6,"rec":0,"t":"Quando tem alguns minutos de silêncio para se concentrar, você pode marcar 1 Ponto de Fadiga para alterar a aparência de todas as criaturas Próximas voluntárias. As novas formas devem ter estrutura corporal e tamanho semelhantes e podem ser tanto algo ou alguém que você já tenha visto quanto criação sua. Uma criatura disfarçada dessa forma tem vantagem em testes de Presença para evitar ser descoberta. Ative uma contagem regressiva (8). Ela diminui em virtude de uma consequência escolhida pelo mestre. Quando a consequência da contagem regressiva é ativada, o disfarce termina."},{"n":"Dom da meia-noite","tipo":"Talento","lvl":7,"rec":2,"t":"Se 4 ou mais cartas de domínio na sua mão pertencerem ao domínio da Meia-noite, receba os seguintes benefícios: • Uma vez por descanso, se você tiver 0 Ponto de Esperança e o mestre for receber Medo, em vez disso, você pode receber 1 Ponto de Esperança; • Ao acertar um ataque, você pode marcar 1 Ponto de Fadiga para somar o resultado de seu Dado de Medo à rolagem de dano."},{"n":"Esvanecer","tipo":"Feitiço","lvl":7,"rec":1,"t":"Quando um ataque que causaria dano físico a você falha, você pode gastar 1 Ponto de Esperança para ficar Escondido em um invólucro de sombras e se teleportar para um ponto próximo do atacante. Você permanece Escondido até o próximo teste que fizer."},{"n":"Caçador Sombrio","tipo":"Talento","lvl":8,"rec":2,"t":"Suas capacidades são aprimoradas quando você age nas sombras. Enquanto estiver na penumbra ou na escuridão, você recebe um bônus de+1 na Evasão e tem vantagem em testes de ataque."},{"n":"Carga Mágica","tipo":"Feitiço","lvl":8,"rec":1,"t":"Ao sofrer dano mágico, coloque um número de marcadores nesta carta igual ao número de PV marcados. Você pode acumular um número de marcadores igual ao seu atributo de conjuração. Quando acertar um ataque contra um alvo, você pode gastar um número qualquer de marcadores e somar uma quantidade equivalente de d6 à rolagem de dano."},{"n":"Terror Noturno","tipo":"Feitiço","lvl":9,"rec":2,"t":"Uma vez por descanso longo, escolha quaisquer alvos muito próximos. Eles passam a ver você como uma horrorosa visão de pesadelo. Os alvos devem ter sucesso em um teste de reação (16) ou ficam temporariamente Horrorizados. Enquanto estiverem Horrorizados, eles ficam Vulneráveis. Roube uma quantidade de Medo do mestre igual ao número de alvos Horrorizados (até o máximo de acúmulos de Medo do mestre). Role um número de d6 igual à quantidade de Medo roubado e cause o resultado deles como dano a cada alvo Horrorizado. Em seguida, descarte todo o Medo que roubou."},{"n":"Tributo do Anoitecer","tipo":"Talento","lvl":9,"rec":1,"t":"Escolha um alvo distante. Quando você tem sucesso em um teste que não resulta em uma rolagem de dano contra ele, coloque um marcador nesta carta. Ao causar dano contra esse alvo, gaste qualquer quantidade de marcadores e some um número equivalente de d12 à rolagem de dano. Você pode manter o Tributo do Anoitecer apenas sobre uma criatura por vez. Ao escolher um novo alvo ou fazer um descanso, marcadores não utilizados são perdidos."},{"n":"Eclipse","tipo":"Feitiço","lvl":10,"rec":2,"t":"Faça um teste de conjuração (16). Uma vez por descanso longo, em um sucesso, faça com que toda a área em alcance distante caia em completa escuridão, na qual apenas você e seus aliados podem enxergar. Os testes de ataque contra você ou seus aliados têm desvantagem dentro dessa escuridão. Além disso, quando você ou um aliado tem um sucesso com Esperança contra um adversário dentro dessa área, o alvo deve marcar 1 Ponto de Fadiga. Este feitiço dura até o mestre gastar 1 Ponto de Medo no turno dele para encerrar o efeito ou até você sofrer dano grave."},{"n":"Espectro das Trevas","tipo":"Feitiço","lvl":10,"rec":1,"t":"Marque 1 Ponto de Fadiga para tornar-se Incorpóreo. Essa condição dura até você fazer um teste tendo outra criatura como alvo. Enquanto estiver Incorpóreo, você é imune a dano físico e pode flutuar e atravessar objetos sólidos. Outras criaturas ainda podem vê-lo nessa forma."}],"Sabedoria":[{"n":"Rastreador Talentoso","tipo":"Talento","lvl":1,"rec":0,"t":"Ao rastrear uma criatura ou grupo de criaturas com base nos sinais da passagem delas, você pode gastar qualquer quantidade de Pontos de Esperança e fazer um número equivalente destas perguntas ao mestre: • Para que direção ele(s) foi(foram)? • Há quanto tempo a criatura ou grupo passou por aqui? • O que a criatura ou grupo fazia neste lugar? • Quantas criaturas havia? Ao encontrar os alvos rastreados dessa forma, você recebe um bônus de +1 na Evasão contra elas."},{"n":"Voz da Natureza","tipo":"Talento","lvl":1,"rec":0,"t":"Você fala o idioma do mundo natural. Quando quiser falar com as plantas e animais ao seu redor, faça um teste de Instinto (12). Em um sucesso, essas plantas ou animais fornecem a informação que conhecem. Se rolar com Medo, o conhecimento fornecido pode ser limitado ou ter um custo. Além disso, antes de fazer um testede conjuração em um ambiente natural, você pode gastar 1 Ponto de Esperança para receber um bônus de +2 na rolagem."},{"n":"Vinha Voraz","tipo":"Feitiço","lvl":1,"rec":1,"t":"Faça um teste de conjuração contra um alvo distante. Em um sucesso, raízes e vinhas saem do chão, causando 1d8+1 de dano físico e Imobilizando o alvo temporariamente. Além disso, em um sucesso, você pode gastar 1 Ponto de Esperança para temporariamente Imobilizar um adversário muito próximo do primeiro."},{"n":"Conjurar Enxame","tipo":"Feitiço","lvl":2,"rec":1,"t":"Besouros Blindados de Tekaira:marque 1 PF para conjurar um enxame de besouros ao seu redor. Na próxima vez que sofrer dano, reduza a gravidade em um limiar. Você pode gastar 1 Ponto de Esperança para manter os besouros conjurados após sofrer dano. Vaga-Lumes: faça um teste de conjuração contra todos os adversários próximos. Gaste 1 Ponto de Esperança para causar 2d8+3 de dano mágico aos alvos atingidos."},{"n":"Familiar da Natureza","tipo":"Feitiço","lvl":2,"rec":1,"t":"Gaste 1 Ponto de Esperança para invocar um pequeno espírito da natureza ou criatura da floresta. Esse familiar fica ao seu lado até seu próximo descanso, até você conjurar Familiar da Natureza novamente ou até que ele seja alvo de um ataque. Ao gastar 1 Ponto de Esperança adicional, você pode invocar um familiar voador. Você pode se comunicar com ele, fazer um teste de conjuração para mandá-lo executar tarefas simples e marcar 1 PF para enxergar pelos olhos dele. Ao causar dano a um adversário corpo a corpo ao seu familiar, some 1d6 à rolagem de dano."},{"n":"Projétil Corrosivo","tipo":"Feitiço","lvl":3,"rec":1,"t":"Faça um teste de conjuração contra um alvo distante. Em um sucesso, cause d6+4 de dano mágico usando sua Proficiência. Além disso, marque 2 ou mais Pontos de Fadiga para deixá-lo permanentemente Corroído. Um alvo Corroído sofre uma penalidade de –1 na Dificuldade para cada 2 Pontos de Fadiga que você gastou. Essa condição é cumulativa."},{"n":"Tronco Descomunal","tipo":"Feitiço","lvl":3,"rec":1,"t":"Uma vez por descanso, você pode conjurar um tronco espesso, retorcido e fácil de escalar em um ponto em alcance próximo. A altura dele pode ser equivalente ao alcance distante. Marque 1 Ponto de Fadiga para usar este feitiço como um ataque. Faça um teste de conjuração contra um adversário ou grupo de adversários próximo. O tronco irrompe, lançando os alvos no ar e derrubando-os, causando d8 de dano físico usando sua Proficiência."},{"n":"Constrição Mortal","tipo":"Feitiço","lvl":4,"rec":1,"t":"Faça um teste de conjuração contra um alvo próximo e escolha uma das seguintes opções: • Você puxa o alvo para um ponto corpo a corpo ou puxa a si mesmo para um ponto corpo a corpo a ele; • Você constringe o alvo e o força a marcar 2 Pontos de Fadiga; • Todos os adversários entre você e o alvo devem ter sucesso em um teste de reação (13) ou são atingidos por vinhas e sofrem 3d6+2 de dano fís. Em um sucesso, vinhas saem de suas mãos, causando o efeito escolhido e Imobilizando o alvo temporariamente."},{"n":"Campo Curativo","tipo":"Feitiço","lvl":4,"rec":2,"t":"Uma vez por descanso longo, você pode conjurar um campo de plantas curativas ao seu redor. Toda a área em alcance próximo irrompe em vida e natureza vibrante, permitindo que você e todos os aliados nessa área recuperem 1 Ponto de Vida. Gaste 2 Pontos de Esperança para curar 2 Pontos de Vida em vez de 1."},{"n":"Pele de Espinhos","tipo":"Feitiço","lvl":5,"rec":1,"t":"Uma vez por descanso, gaste 1 Ponto de Esperança para fazer com que espinhos brotem de todo o seu corpo. Ao fazer isso, coloque um número de marcadores igual ao seu atributo de conjuração nesta carta. Ao sofrer dano, você pode gastar qualquer quantidade de marcadores e rolar um número equivalente de d6. Reduza o dano sofrido em um número igual à soma dos resultados. Se estiver corpo a corpo ao atacante, cause a mesma quantidade de dano a ele. Após um descanso, marcadores não utilizados são perdidos."},{"n":"Fortaleza Selvagem","tipo":"Feitiço","lvl":5,"rec":1,"t":"Faça um teste de conjuração (13). Em um sucesso, gaste 2 Pontos de Esperança para fazer crescer uma barricada natural em formato de domo na qual você e um aliado podem buscar cobertura. Uma criatura dentro do domo não pode atacar nem ser alvo de ataques. Ataques feitos contra o domo acertam automaticamente. O domo tem 3 PV (coloque marcadores nesta carta para representá-los) e tem 15/30 como seus limiares de dano. (menor 1–14: 1 PV · maior 15–29: 2 PV · grave 30+: 3 PV)."},{"n":"Conjurar Montarias","tipo":"Feitiço","lvl":6,"rec":0,"t":"Gaste qualquer quantidade de Esperança para conjurar um número equivalente de montarias (como cavalos, camelos ou elefantes) que você e seus aliados podem usar até seu próximo descanso longo ou até que as montarias sofram dano. As montarias dobram sua velocidade de viagem por terra e, quando em perigo, permitem que você se mova para um ponto em alcance distante sem precisar de teste. Criaturas sobre as montarias sofrem uma penalidade de –2 em testes de ataque e ganham +2 de bônus nas rolagens de dano."},{"n":"Coletor","tipo":"Talento","lvl":6,"rec":1,"t":"Como um movimento de repouso adicional que você pode escolher, role 1d6 para descobrir o que você coleta. Colabore com o mestre para descrever esse item e adicione-o ao seu inventário como um consumível. Seu grupo pode carregar no máximo cinco consumíveis coletados por vez. 1d6 Consumível Efeito 1 Um alimento único recupera 2 Pontos de Fadiga 2 Uma bela relíquia receba 2 Pontos de Esperança 3 Uma runa arcana +2 em um teste de conjuração 4 Um frasco curativo recupera 2 Pontos de Vida 5 Um talismã da sorte role qualquer dado novamente 6 Escolha uma das opções acima."},{"n":"Dom da sabedoria","tipo":"Talento","lvl":7,"rec":2,"t":"Se 4 ou mais cartas de domínio na sua mão pertencerem ao domínio da Sabedoria, receba os seguintes benefícios: • Enquanto estiver em um ambiente natural, você ganha um bônus de +2 em testes de conjuração; • Uma vez por descanso, você pode dobrar sua Agilidade ou Instinto ao fazer um teste que use esse atributo. Você deve fazer isso antes de rolar os dados."},{"n":"Aspecto Selvagem","tipo":"Feitiço","lvl":7,"rec":2,"t":"Uma vez por descanso longo, marque 1 Ponto de Fadiga para canalizar a natureza ao seu redor e aprimorar a si mesmo. Descreva como sua aparência muda e, em seguida, coloque 1d6 nesta carta, com o 1 virado para cima. Enquanto o Dado de Aspecto Selvagem estiver ativo, você soma seu valor a todos seus testes. Após somar seu valor a um teste, aumente o valor do dado em 1. Se o valor do dado for ultrapassar 6, ou se você fizer um descanso, essa forma termina e você deve marcar 1 Ponto de Fadiga adicional."},{"n":"Espíritos da Floresta","tipo":"Feitiço","lvl":8,"rec":2,"t":"Façaumteste de conjuração (13).Emumsucesso, gastequalquer quantidade de Pontos de Esperança paracriarumnúmeroequivalentedeespíritosda floresta.Todos surgemempontosàsuaescolhaem alcancedistanteefornecemos seguintesbenefícios: • Seus aliados recebem um bônus de +3 em testes de ataque contra adversários cac a um espírito; • Se um aliado marcar 1 Ponto de Armadura enquanto estiver cac a um dos espíritos, ele pode marcar 1 Ponto de Armadura adicional. Após conceder um benefício ou sofrer qualquer dano, um espírito desaparece."},{"n":"Barreira Revigorante","tipo":"Feitiço","lvl":8,"rec":1,"t":"Faça um teste de conjuração (15). Uma vez por descanso, em um sucesso, crie uma barreira temporária de energia protetora que fica Muito Próxima de você. Você e todos os aliados que estão dentro da barreira quando este feitiço é conjurado recuperam 1d4 PV. Enquanto a barreira estiver de pé, você e todos os aliados no interior dela têm resistência a dano físico oriundo do lado de fora. Quando você se move, a barreira se move com você."},{"n":"Santuário Selvagem","tipo":"Talento","lvl":9,"rec":2,"t":"Após um descanso longo, coloque uma quantidade de marcadores nesta carta igual ao número de cartas do domínio da Sabedoria na sua mão e reserva. Quando fizer um teste de conjuração, você pode gastar qualquer número de marcadores após o teste para receber um bônus de +1 por marcador. Ao ter sucesso crítico em um teste de conjuração para um feitiço do domínio da Sabedoria, receba um marcador. Após o próximo descanso longo, marcadores não utilizados são perdidos."},{"n":"Soberania Vegetal","tipo":"Feitiço","lvl":9,"rec":1,"t":"Faça um teste de conjuração (18). Uma vez por descanso longo, em um sucesso, você remodela o mundo natural, alterando a flora em qualquer ponto em alcance distante. Por exemplo, você pode fazer árvores brotarem instantaneamente, criar um caminho através de vegetação densa ou erguer uma muralha de raízes."},{"n":"Força da Natureza","tipo":"Feitiço","lvl":10,"rec":2,"t":"Marque 1 Ponto de Fadiga para se transformar em um grande espírito da natureza, recebendo os seguintes benefícios: • Ao ter sucesso em um teste de ataque ou conjuração, receba +10 de bônus na rolagem de dano; • Ao causar dano suficiente para derrotar uma criatura Próxima, você a absorve e recupera 1 PA; • Você não pode ser Imobilizado. Antes de fazer um teste, você deve gastar 1 Ponto de Esperança. Se não puder fazer isso, vol
