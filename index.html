ta à forma normal."},{"n":"Tempestade","tipo":"Feitiço","lvl":10,"rec":2,"t":"Escolha um dos tipos de tempestade abaixo e faça um teste de conjuração contra todos os alvos distantes. Alvos atingidos sofrem os efeitos até o mestre gastar1 Ponto de Medo no turno dele para encerrar este feitiço. • Nevasca: causa 2d20+8 de dano mágico e deixa os alvos temporariamente Vulneráveis. • Furacão: causa 3d10+10 de dano mágico. Escolha uma direção para a qual o vento sopra. Alvos não podem se mover contra o vento. • Tempestade de Areia: cause 5d6+9 de dano mágico. Ataques oriundos de um ponto além do alcance corpo a corpo têm desvantagem."}],"Esplendor":[{"n":"Raio Luminoso","tipo":"Feitiço","lvl":1,"rec":1,"t":"Faça um teste de conjuração contra um alvo distante. Em um sucesso, gaste 1 Ponto de Esperança para lançar um raio de luz radiante contra ele, causando d8+2 de dano mágico usando sua Proficiência. O alvo fica temporariamente Vulnerável e emite uma luz intensa até se recuperar dessa condição."},{"n":"Toque Reparador","tipo":"Feitiço","lvl":1,"rec":1,"t":"Você toca uma criatura e canaliza magia curativa para fechar seus ferimentos. Quando pode passar alguns minutos se concentrando em quem está ajudando, gaste 2 Pontos de Esperança para recuperar 1 PV ou PF do alvo. Uma vez por descanso longo, ao passar esse momento curativo descobrindo algo novo sobre a criatura ou revelando algo sobre si mesmo a ela, você pode fazê-la recuperar 2 Pontos de Vida ou Pontos de Fadiga, em vez de 1."},{"n":"Validação","tipo":"Talento","lvl":1,"rec":0,"t":"Uma vez por descanso, após o teste de um aliado, mas antes das consequências ocorrerem, você pode auxiliá-lo com palavras de apoio. Ao fazer isso, seu aliado pode rolar os dados novamente."},{"n":"Últimas Palavras","tipo":"Feitiço","lvl":2,"rec":1,"t":"Você pode conceder um momento de vida a um cadáver para conversar com ele. Faça um teste de conjuração (13). Em um sucesso com Esperança, o cadáver responde até três perguntas. Em um sucesso com Medo, o cadáver responde uma pergunta. O cadáver responde com sinceridade, mas não pode fornecer informações que desconhecia enquanto estava vivo. Se falhar, ou após o cadáver terminar de responder às suas perguntas, ele se desfaz em pó."},{"n":"Mãos Curativas","tipo":"Feitiço","lvl":2,"rec":1,"t":"Faça um teste de conjuração (13) tendo como alvo uma criatura corpo a corpo que não seja você. Em um sucesso, marque 1 Ponto de Fadiga para recuperar 2 Pontos de Vida ou Pontos de Fadiga do alvo. Se falhar, marque 1 Ponto de Fadiga para recuperar 1 PV ou PF do alvo. Você não pode curar o mesmo alvo novamente até seu próximo descanso longo."},{"n":"Novo Fôlego","tipo":"Talento","lvl":3,"rec":2,"t":"Uma vez por descanso, ao acertar um ataque contra um adversário, você pode recuperar 1 Ponto de Vida ou 3 Pontos de Fadiga. Em um sucesso com Esperança, você também recupera 1 PV ou 3 PF de um aliado próximo."},{"n":"Voz da Razão","tipo":"Talento","lvl":3,"rec":1,"t":"Você fala com poder e autoridade sem igual. Você tem vantagem em testes para acalmar situações violentas ou convencer alguém a seguir sua ordem. Além disso, você demonstra mais firmeza sob pressão. Quando todos seus Pontos de Fadiga estiverem marcados, você ganha um bônus de +1 na Proficiência para rolagens de dano."},{"n":"Adivinhação","tipo":"Feitiço","lvl":4,"rec":1,"t":"Uma vez por descanso longo, gaste 3 Pontos de Esperança para se comunicar com as forças do além e fazer uma única pergunta sobre algum evento, lugar, pessoa ou situação no futuro próximo que possa ser respondida com “sim” ou “não”. O tempo presente desaparece por um momento e a resposta surge magicamente diante de você."},{"n":"Sigilo da Vida","tipo":"Feitiço","lvl":4,"rec":1,"t":"Gaste 3 Pontos de Esperança e escolha um aliado próximo. Ele é marcado por um brilhante sigilo de proteção. Quando esse aliado for fazer um movimento de morte, ele recupera 1 PV em vez disso. Este efeito termina quando salva o alvo de um movimento de morte, quando você conjura Sigilo da Vida sobre outro alvo ou quando faz um descanso longo."},{"n":"Moldar Material","tipo":"Feitiço","lvl":5,"rec":1,"t":"Gaste 1 Ponto de Esperança para moldar parte de um material natural que esteja tocando (como gelo, madeira ou pedra) à sua vontade. A área do material não pode ser maior que você. Por exemplo, você pode criar uma ferramenta rudimentar ou criar uma porta. Você só pode afetar o material próximo do ponto que você está tocando."},{"n":"Punição","tipo":"Feitiço","lvl":5,"rec":2,"t":"Uma vez por descanso, gaste 3 Pontos de Esperança para carregar sua Punição. Ao acertar seu próximo ataque de arma, dobre o resultado da rolagem de dano. Independente do tipo de dano da arma, esse ataque causa dano mágico."},{"n":"Restauração","tipo":"Feitiço","lvl":6,"rec":2,"t":"Após um descanso longo, coloque um número de marcadores igual ao seu atributo de conjuração nesta carta. Toque uma criatura e gaste qualquer quantidade de marcadores. Para cada marcador gasto, recupere 2 Pontos de Vida ou Pontos de Fadiga do alvo. Você também pode gastar um marcador desta carta para tocar uma criatura e recuperá-la da condição Vulnerável ou curar uma doença física ou mágica (o mestre pode exigir o gasto de mais marcadores, dependendo da potência da doença). Após um descanso longo, marcadores não utilizados são perdidos."},{"n":"Zona de Proteção","tipo":"Feitiço","lvl":6,"rec":2,"t":"Faça um teste de conjuração (16). Uma vez por descanso longo, em um sucesso, escolha um ponto em alcance distante e crie uma zona de proteção visível para todos os aliados muito próximos do ponto de origem. Ao fazer isso, coloque 1d6 nesta carta, com o 1 virado para cima. Quando um aliado na zona de proteção sofre dano, reduza esse dano pelo valor do dado. Em seguida, aumente o valor do dado em um. Se o valor do dado for ultrapassar 6, este efeito termina."},{"n":"Golpe Curativo","tipo":"Feitiço","lvl":7,"rec":1,"t":"Ao causar dano a um adversário, você pode gastar 2 Pontos de Esperança para recuperar 1 PV de um aliado próximo."},{"n":"Dom do Esplendor","tipo":"Talento","lvl":7,"rec":2,"t":"Se 4 ou mais cartas de domínio na sua mão pertencerem ao domínio do Esplendor, receba os seguintes benefícios: • Um bônus de +3 no seu limiar de dano grave; • Uma vez por descanso longo, quando o dano sofrido exigir que marque PV, você pode, em vez disso, marcar uma quantidade equivalente de PF ou gastar uma quantidade equivalente de Esperança."},{"n":"Aura Defensora","tipo":"Feitiço","lvl":8,"rec":2,"t":"Marque 1 Ponto de Fadiga para conjurar uma aura protetora sobre um alvo muito próximo. Quando o alvo marca 1 Ponto de Armadura, ele reduz a gravidade do ataque em um limiar adicional. Se este feitiço fizer uma criatura que sofreria dano não marcar Pontos de Vida, o efeito termina. Você pode manter a Aura Defensora apenas sobre uma criatura por vez."},{"n":"Fulgor Atordoante","tipo":"Feitiço","lvl":8,"rec":2,"t":"Faça um teste de conjuração para disparar raios solares contra todos os adversários distantes à sua frente. Em um sucesso, gaste qualquer quantidade de Pontos de Esperança e force um número equivalente de alvos atingidos a fazer um teste de reação (14). Alvos bem-sucedidos sofrem 3d20+3 de dano mágico. Alvos que falharem sofrem 4d20+5 de dano mágico e ficam temporariamente Atordoados. Enquanto estiverem Atordoados, os alvos não podem usar reações e não podem fazer quaisquer outras ações até que se recuperem dessa condição."},{"n":"Aura Esmagadora","tipo":"Feitiço","lvl":9,"rec":2,"t":"Faça um teste de conjuração (15) para fortalecer sua aura com magia. Em um sucesso, gaste 2 Pontos de Esperança para tornar sua Presença igual ao seu atributo de conjuração até seu próximo descanso longo. Enquanto este feitiço estiver ativo, seus adversários devem marcar 1 Ponto de Fadiga ao selecionarem você como alvo de um ataque."},{"n":"Feixe de Remissão","tipo":"Feitiço","lvl":9,"rec":2,"t":"Faça um teste de conjuração (16). Em um sucesso, marque uma quantidade qualquer de PF para escolher uma linha de aliados em alcance distante como alvo. Você pode recuperar um número de Pontos de Vida, divididos como você quiser entre os alvos, igual à quantidade de PF que marcou."},{"n":"Revigorar","tipo":"Feitiço","lvl":10,"rec":3,"t":"Após você ou um aliado próximo usar uma habilidade com limite de uso (como uma vez por descanso ou uma vez por sessão), você pode gastar uma quantidade qualquer de Pontos de Esperança e rolar um número equivalente de d6. Se tirar 6 em qualquer dado, a habilidade pode ser usada novamente."},{"n":"Ressurreição","tipo":"Feitiço","lvl":10,"rec":2,"t":"Faça um teste de conjuração (20). Em um sucesso, faça com que uma criatura morta há no máximo 100 anos volte à vida com todas as suas capacidades. Em seguida, role 1d6. Se tirar 5 ou menos, coloque esta carta na reserva permanentemente. Se falhar, você não pode conjurar Ressurreição novamente por uma semana."}],"Valor":[{"n":"Armadura Corporal","tipo":"Talento","lvl":1,"rec":0,"t":"Enquanto não equipar uma armadura, você tem Armadura base igual a 3 + sua Força e usa estes limiares de dano base: • 1º patamar: 9/19; • 2º patamar: 11/24; • 3º patamar: 13/31; • 4º patamar: 15/38."},{"n":"Imposição","tipo":"Talento","lvl":1,"rec":0,"t":"Ataque um alvo corpo a corpo com sua arma principal. Em um sucesso, você causa dano e o empurra para um ponto em alcance próximo. Em um sucesso com Esperança, acrescente 1d6 à rolagem de dano. Além disso, gaste 1 Ponto de Esperança para deixá-lo temporariamente Vulnerável."},{"n":"Sou Seu Escudo","tipo":"Talento","lvl":1,"rec":1,"t":"Quando um aliado muito próximo for sofrer dano, você pode marcar 1 Ponto de Fadiga para prostrar-se no caminho e virar o alvo do ataque no lugar dele. Ao sofrer dano desse ataque, você pode marcar um número qualquer de Pontos de Armadura."},{"n":"Força Esmagadora","tipo":"Talento","lvl":2,"rec":1,"t":"Você usa toda sua força física em um combate. Ao acertar um ataque usando uma arma com alcance corpo a corpo, receba um bônus igual à sua Força na rolagem de dano."},{"n":"Presença Corajosa","tipo":"Talento","lvl":2,"rec":0,"t":"Ao fazer um teste de Presença, você pode gastar 1 Ponto de Esperança para somar sua Força à rolagem. Além disso, uma vez por descanso, quando for sofrer uma condição, você pode descrever como sua Presença Corajosa ajuda na situação e impede que você sofra a condição."},{"n":"Inspiração Crítica","tipo":"Talento","lvl":3,"rec":1,"t":"Uma vez por descanso, quando você obtém um sucesso crítico em um ataque, todos os aliados muito próximos podem recuperar 1 PF ou receber 1 Ponto de Esperança."},{"n":"Palavras de Conforto","tipo":"Talento","lvl":3,"rec":1,"t":"Uma vez por descanso longo, quando você consola ou inspira um aliado que falhou em um teste, vocês dois podem recuperar 2 Pontos de Fadiga cada."},{"n":"Incitar","tipo":"Talento","lvl":4,"rec":1,"t":"Descreva como você provoca um alvo próximo. Em seguida, faça um teste de Presença contra ele. Em um sucesso, o alvo deve marcar 1 PF e, na próxima vez que o mestre colocá-lo em foco, ele deve atacar você com desvantagem."},{"n":"Bastião","tipo":"Talento","lvl":4,"rec":2,"t":"Quando um aliado próximo falhar em um teste, você pode gastar 2 Pontos de Esperança para permitir que ele role novamente o Dado de Medo ou de Esperança."},{"n":"Armeiro","tipo":"Talento","lvl":5,"rec":1,"t":"Você recebe um bônus de +1 na Armadura enquanto estiver usando armadura. Ao escolher Reparar Armadura como movimento de repouso durante um descanso, seus aliados também recuperam 1 Ponto de Armadura."},{"n":"Golpe Inspirador","tipo":"Talento","lvl":5,"rec":1,"t":"Uma vez por descanso, ao ter sucesso crítico em um ataque, você e todos os aliados que possam vê-lo ou ouvi-lo podem recuperar 1 Ponto de Vida ou 1d4 Pontos de Fadiga."},{"n":"Inevitável","tipo":"Talento","lvl":6,"rec":1,"t":"Ao falhar em um teste, seu próximo teste é feito com vantagem."},{"n":"Altivez","tipo":"Talento","lvl":6,"rec":2,"t":"Receba um bônus igual à sua Proficiência no seu limiar grave. Ao marcar 1 ou mais PV devido a um ataque, recupere 1 Ponto de Fadiga."},{"n":"Desprezar Fraqueza","tipo":"Talento","lvl":7,"rec":1,"t":"Quando sofrer dano, você pode marcar 1 Ponto de Fadiga para reduzir a gravidade do dano em um limiar. Ao fazer isso, role 1d6. Se tirar 3 ou menos, coloque esta carta na reserva."},{"n":"Dom do valor","tipo":"Talento","lvl":7,"rec":1,"t":"Se 4 ou mais cartas de domínio na sua mão pertencerem ao domínio do Valor, receba os seguintes benefícios: • Bônus de +1 na Armadura; • Ao marcar 1 ou mais Pontos de Vida sem marcar Pontos de Armadura, recupere 1 PA."},{"n":"Testar os Limites","tipo":"Talento","lvl":8,"rec":1,"t":"Uma vez por descanso longo, marque 3 Pontos de Fadiga para testar os limites de seu corpo. Você recebe um bônus de +2 em todos os atributos até seu próximo descanso."},{"n":"Abalo Sísmico","tipo":"Talento","lvl":8,"rec":2,"t":"Gaste 2 Pontos de Esperança para golpear o solo abaixo de você. Faça um teste de Força contra todos os alvos próximos. Alvos atingidos são empurrados para um ponto em alcance distante e devem fazer um teste de reação (17). Quem falhar, sofre 4d10+8 de dano. Quem passar sofre metade do dano."},{"n":"Manter Posição","tipo":"Talento","lvl":9,"rec":1,"t":"Descreva a posição defensiva que você assume e gaste 1 Ponto de Esperança. Se um adversário se mover para alcance muito próximo, ele é puxado para o alcance corpo a corpo e fica Imobilizado. Esta condição dura até você se mover ou rolar uma falha com Medo, ou até o mestre gastar 2 Pontos de Medo no turno dele para encerrá-la."},{"n":"Líder Exemplar","tipo":"Talento","lvl":9,"rec":3,"t":"Ao causar dano a um adversário, você pode marcar 1 PF e descrever como encoraja seus aliados. O próximo personagem que atacar esse adversário pode recuperar 1 Ponto de Fadiga ou receber 1 Ponto de Esperança."},{"n":"Invencível","tipo":"Talento","lvl":10,"rec":4,"t":"Ao marcar seu último Ponto de Vida, em vez de fazer um movimento de morte, você pode recuperar 1d6 Pontos de Vida. Em seguida, esta carta vai para sua reserva."},{"n":"Defesa Irredutível","tipo":"Talento","lvl":10,"rec":1,"t":"Quando for marcar 1 Ponto de Armadura, role uma quantidade de d6 igual à sua Proficiência. Se algum tirar 6, reduza a gravidade em um limiar sem marcar 1 Ponto de Armadura."}],"Sangue":[{"n":"Espinho de Sangue","tipo":"Feitiço","lvl":1,"rec":1,"t":"Faça um teste de conjuração contra um alvo distante. Em um sucesso, marque 1 Ponto de Fadiga para causar d10 de dano mágico ao alvo usando sua Proficiência. Em um sucesso com Esperança, o alvo também marca 1 Ponto de Fadiga. Em uma rolagem com Medo, marque 1 Ponto de Fadiga."},{"n":"Talismã da Força Vital","tipo":"Feitiço","lvl":1,"rec":0,"t":"Marque 1 Ponto de Vida para conjurar um talismã infundido com a sua essência vital. Ele aparece na sua mão, e quem o carregar recebe seu benefício: sempre que o portador marcar 2 ou mais Pontos de Vida, ele pode gastar 1 Ponto de Esperança para reduzir em 1 o número de PV marcados. O talismã desaparece se você não tiver nenhum Ponto de Vida marcado ou se conjurar este feitiço novamente."},{"n":"Poder Através da Dor","tipo":"Talento","lvl":1,"rec":1,"t":"Se tiver pelo menos 1 Ponto de Vida marcado, você recebe um bônus em suas rolagens de dano igual ao dobro do número de Pontos de Vida que tem marcados."},{"n":"Marca da Punição","tipo":"Feitiço","lvl":2,"rec":1,"t":"Ao causar dano a uma criatura, marque 1 Ponto de Fadiga para gravar nela uma marca mágica vermelha. Até a marca desaparecer, você sempre sabe a direção da criatura marcada em relação a você, e ela marca 1 Ponto de Fadiga cada vez que causar dano a você ou a um aliado seu muito próximo de você. A marca desaparece quando você usar este feitiço novamente."},{"n":"Manipulação de Vitalidade","tipo":"Feitiço","lvl":2,"rec":0,"t":"Faça um teste de conjuração contra um alvo muito próximo. Se conjurar sobre um aliado, faça o teste com vantagem. Em um sucesso, marque 1 Ponto de Fadiga e escolha um dos efeitos: • O alvo se acalma e recupera 1 Ponto de Fadiga (em um sucesso com Esperança, recupera 2); • O alvo fica mais ansioso e marca 1 Ponto de Fadiga (em um sucesso com Esperança, marca 2)."},{"n":"Marionete de Sangue","tipo":"Feitiço","lvl":3,"rec":2,"t":"Faça um teste de conjuração contra uma criatura (viva ou morta) distante. Em um sucesso, gaste 1 Ponto de Esperança para controlar o alvo, fazendo-o se mover, atacar ou ambos, na ordem que você escolher. Se fizer a criatura se mover, ela vai até um local à sua escolha em alcance próximo dela. Se fizer a criatura atacar, faça um teste de conjuração contra um alvo corpo a corpo dela. Em um sucesso, cause d10 de dano físico usando sua Proficiência."},{"n":"Sangria Ardente","tipo":"Feitiço","lvl":3,"rec":2,"t":"Faça um teste de conjuração (12). Em um sucesso, marque 1 Ponto de Vida ao conjurar uma gota de sangue, que você arremessa em um ponto distante. Uma onda de calor preenche a área muito próxima desse ponto, inflamando os órgãos de quem estiver nela. Cada alvo na área marca 1 Ponto de Vida. Em um sucesso com Esperança, cada alvo marca 2 Pontos de Vida em vez disso."},{"n":"Arpão Macabro","tipo":"Feitiço","lvl":4,"rec":1,"t":"Você lança um arpão de sangue em um local ou criatura distante. Se o alvo for um local, faça um teste de conjuração (13); em um sucesso, marque 1 Ponto de Fadiga para se puxar até um ponto corpo a corpo dele. Se o alvo for uma criatura, faça um teste de conjuração contra ela; em um sucesso, marque 1 Ponto de Fadiga para causar 3d8 de dano mágico. Em seguida, você puxa o alvo em linha reta até você, ou se puxa em linha reta até o alvo, terminando corpo a corpo um do outro."},{"n":"Tecer a Carne","tipo":"Feitiço","lvl":4,"rec":1,"t":"Uma vez por descanso, marque 1 Ponto de Vida para permitir que cada aliado próximo recupere 1 Ponto de Vida ou 1 Ponto de Fadiga. Você pode marcar 1 Ponto de Fadiga para permitir que esses aliados recuperem um de cada."},{"n":"Sofrimento Mútuo","tipo":"Feitiço","lvl":5,"rec":1,"t":"Quando o ataque de uma criatura fizer você marcar 1 ou mais Pontos de Vida, você pode fazer um teste de reação usando seu atributo de conjuração contra ela. Em um sucesso, a criatura marca o mesmo número de Pontos de Vida que você, e você não pode usar este feitiço novamente até terminar um descanso."},{"n":"Parasita da Vontade","tipo":"Feitiço","lvl":5,"rec":1,"t":"Faça um teste de conjuração contra uma criatura muito distante. Em um sucesso, marque 1 Ponto de Vida para conjurar um minúsculo verme de sangue mágico que se entoca no alvo. Em um sucesso com Esperança, o alvo não percebe o verme. Você tem vantagem em qualquer teste de Presença contra o alvo e, sempre que ele fizer uma rolagem, você pode gastar 1 Ponto de Esperança para impor desvantagem a ela. Você pode destruir o verme para fazer o alvo marcar 1 Ponto de Vida."},{"n":"Vínculo de Sangue","tipo":"Feitiço","lvl":6,"rec":1,"t":"Faça um teste de Conjuração contra um adversário em alcance Próximo. Em um sucesso, marque Estresse para retardar a vitalidade do alvo. O alvo fica temporariamente Restringido e Vulnerável. Cada vez que o alvo é posto em foco enquanto qualquer uma dessas condições persiste, ele marca Estresse."},{"n":"Elo Vital","tipo":"Feitiço","lvl":6,"rec":0,"t":"Faça um teste de Conjuração (14). Uma vez por descanso em um sucesso, você conjura um vínculo mágico entre você e um alvo disposto em alcance Próximo que dura até o fim da cena. Quando qualquer uma das criaturas vinculadas marcaria um Ponto de Vida, a outra criatura vinculada pode marcar um Ponto de Vida em seu lugar."},{"n":"Tocado pelo Sangue","tipo":"Talento","lvl":7,"rec":2,"t":"Quando 4 ou mais das cartas de domínio no seu loadout são do domínio Sangue, ganhe os seguintes benefícios: você ganha uma Esperança quando sofre dano Maior ou maior; quando você faz um teste de Conjuração, pode gastar uma Esperança para ganhar um bônus igual ao número de Pontos de Vida que marcou."},{"n":"Golpe Vampírico","tipo":"Talento","lvl":7,"rec":2,"t":"Quando você causa dano Maior ou maior a um adversário em alcance Próximo, você pode marcar Estresse para limpar um Ponto de Vida."},{"n":"Proteção Vital","tipo":"Feitiço","lvl":8,"rec":1,"t":"Escolha o tipo de dano físico ou mágico e faça um teste de Conjuração (15). Em um sucesso, você traça um círculo de sangue Muito Próximo no chão ao seu redor que concede às criaturas de sua escolha dentro dele resistência a esse tipo de dano. O círculo dura até você sofrer dano Maior ou maior, sair do círculo ou conjurar este feitiço de novo."},{"n":"Árvore Sangrenta","tipo":"Feitiço","lvl":8,"rec":2,"t":"Uma vez por descanso longo, quando um adversário em alcance Próximo é derrotado, você pode fazer o corpo dele irromper com uma árvore venosa e retorcida que jorra essência vital. Coloque uma quantidade de marcadores nesta carta igual ao seu valor de Conjuração. Um PJ em alcance Corpo a Corpo da árvore pode gastar um marcador desta carta para sifonar a essência vital da árvore e limpar um Ponto de Vida."},{"n":"Onda de Icor","tipo":"Feitiço","lvl":9,"rec":3,"t":"Marque um Ponto de Vida para fazer um teste de Conjuração contra todos os alvos em alcance Próximo à sua frente. Em um sucesso, cause dano mágico d10 usando o número de Pontos de Vida que você marcou em vez de sua Proficiência. Em uma falha, cause metade do dano."},{"n":"Glifo da Hemorragia","tipo":"Feitiço","lvl":9,"rec":3,"t":"Faça um teste de Conjuração contra um alvo em alcance Próximo. Em um sucesso, gaste uma Esperança para marcar o alvo com um glifo mágico que o faz sangrar profusamente. Até o glifo desaparecer, o dano que o alvo sofre é aumentado em um limiar. O glifo desaparece quando você descansa, conjura este feitiço de novo, ou o alvo sofre dano Grave ou maior."},{"n":"Adamância Escabrosa","tipo":"Talento","lvl":10,"rec":1,"t":"Suas feridas se selam em crostas blindadas. Quando você marca 2 ou mais Pontos de Vida de um ataque, limpe um Compartimento de Armadura."},{"n":"Festim Sanguíneo","tipo":"Feitiço","lvl":10,"rec":2,"t":"Faça um teste de Conjuração contra um adversário em alcance Próximo. Uma vez por descanso em um sucesso, role uma quantidade de d6 igual ao número de Pontos de Vida que você marcou, e você pode marcar um Ponto de Vida adicional para rolar novamente qualquer quantidade desses dados. O alvo marca um Ponto de Vida para cada resultado 4 ou maior."}],"Pavor":[{"n":"Ataque Devastador","tipo":"Feitiço","lvl":1,"rec":1,"t":"Faça um teste de conjuração contra um alvo distante. Em um sucesso, o alvo sofre d6+1 de dano mágico usando sua Proficiência e, na próxima vez que ele causar dano a um aliado, esse dano é reduzido à metade. Se você tiver sucesso com Medo, o alvo sofre d10+1 de dano mágico usando sua Proficiência em vez disso."},{"n":"Voz Pavorosa","tipo":"Feitiço","lvl":1,"rec":0,"t":"Você pode falar magicamente direto nos ouvidos de uma criatura que possa ver. Para atormentá-la com suas palavras, faça um teste de conjuração contra ela. Em um sucesso, ela deve marcar 1 Ponto de Fadiga e fica temporariamente Vulnerável."},{"n":"Véu Umbral","tipo":"Feitiço","lvl":1,"rec":1,"t":"Uma vez por descanso, ao rolar com Medo, você pode gastar qualquer quantidade de Pontos de Esperança para colocar o mesmo número de marcadores nesta carta, envolvendo-se em energia sombria. Depois que um teste de ataque for feito contra você, você pode gastar qualquer número de marcadores para impor penalidade de −1 ao ataque por marcador. No seu próximo descanso, remova todos os marcadores desta carta."},{"n":"Retribuição Hedionda","tipo":"Feitiço","lvl":2,"rec":2,"t":"Quando um aliado próximo sofrer dano de um alvo que você possa ver, você pode fazer um teste de reação de conjuração contra o alvo. Em um sucesso, marque 1 Ponto de Fadiga para causar d6 de dano mágico a ele usando sua Proficiência."},{"n":"Sifão de Essência","tipo":"Feitiço","lvl":2,"rec":1,"t":"Faça um teste de conjuração contra um alvo muito próximo. Uma vez por descanso longo, em um sucesso, o alvo sofre d20 de dano mágico usando sua Proficiência. Você recupera um número de Pontos de Vida igual ao número de PV que o alvo marcou neste ataque. Em um sucesso com Medo, você recebe +1 de bônus na Proficiência para este ataque."},{"n":"Aterrorizar","tipo":"Feitiço","lvl":3,"rec":1,"t":"Faça um teste de conjuração contra um alvo distante. Em um sucesso, o alvo marca 1d4 Pontos de Fadiga e você pode escolher fazê-lo fugir um alcance para longe de você (de próximo para distante, de distante para muito distante etc.). Em um sucesso com Medo, o alvo fica temporariamente Vulnerável."},{"n":"Trauma Compartilhado","tipo":"Feitiço","lvl":3,"rec":1,"t":"Você pode transferir o sofrimento de uma criatura para outra. Uma vez por descanso, marque qualquer número de Pontos de Vida em uma criatura voluntária corpo a corpo para recuperar o mesmo número de Pontos de Vida de outra criatura voluntária corpo a corpo. Você pode escolher a si mesmo no lugar de qualquer uma das criaturas."},{"n":"Correntes da Aflição","tipo":"Feitiço","lvl":4,"rec":2,"t":"Marque 2 Pontos de Fadiga para Acorrentar temporariamente um alvo próximo. Quando uma criatura Acorrentada causa dano, o alvo do ataque dela reduz em 1 o número de Pontos de Vida que marcaria. Você não pode ter mais de uma criatura Acorrentada por vez."},{"n":"Invocar Horror","tipo":"Feitiço","lvl":4,"rec":2,"t":"Faça um teste de conjuração contra um alvo distante. Em um sucesso, gaste 1 Ponto de Esperança para invocar uma criatura de outro mundo que o ataca e causa d10 de dano mágico usando sua Proficiência. O alvo deve ter sucesso em um teste de reação (12) para se firmar diante do horror ou marca 1d4 Pontos de Fadiga. Após o ataque, a criatura se dissipa."},{"n":"Névoa Espectral","tipo":"Feitiço","lvl":5,"rec":0,"t":"Marque 1 Ponto de Fadiga para invocar uma névoa sinistra que deixa você e quaisquer alvos próximos momentaneamente incorpóreos. Enquanto incorpórea, uma criatura pode atravessar objetos sólidos e é imune a dano físico. Ela volta a ser corpórea depois de atravessar um objeto sólido ou fazer um teste de ação. Caso contrário, o efeito termina ao fim da cena."},{"n":"Golpe Funesto","tipo":"Feitiço","lvl":5,"rec":1,"t":"Após acertar um ataque, você pode gastar 2 Pontos de Esperança para sugar poder do alvo. Para cada Ponto de Vida que o alvo marcou neste ataque, o mestre perde 1 Ponto de Medo."},{"n":"Fogo Sombrio","tipo":"Feitiço","lvl":6,"rec":2,"t":"Faça um teste de Conjuração contra todos os adversários em alcance Próximo. Você pode gastar uma Esperança para cada um que você tiver sucesso, e eles devem fazer um teste de Reação (14). Em uma falha, sofrem 1d8+6 de dano mágico usando sua Proficiência ao serem engolfados em chamas sombrias. Em um sucesso, sofrem metade do dano."},{"n":"Susto","tipo":"Feitiço","lvl":6,"rec":0,"t":"Quando você causa dano mágico a um alvo, você pode marcar Estresse para se teletransportar imediatamente para o alcance Corpo a Corpo dele. Quando você faz isso, ele fica Vulnerável até marcar um ou mais Pontos de Vida."},{"n":"Tocado pelo Pavor","tipo":"Talento","lvl":7,"rec":2,"t":"Quando 4 ou mais das cartas de domínio no seu loadout são do domínio Pavor, ganhe os seguintes benefícios: quando você tem sucesso com Medo, pode marcar 2 Estresse para impedir o mestre de ganhar um Medo. Uma vez por descanso, ao fazer um teste, você pode adicionar +1 à rolagem para cada marcador de Medo que o mestre tiver acumulado."},{"n":"Muralha da Fome","tipo":"Feitiço","lvl":7,"rec":2,"t":"Tenha sucesso em um teste de Conjuração (13) para criar uma muralha visível de energia necrótica contorcida em linha entre dois pontos em alcance Distante que dura até você marcar um Ponto de Vida ou conjurar este feitiço de novo. Qualquer criatura dentro da muralha quando ela surge, ou que tente passar por ela, deve marcar 2 Estresse e fazer um teste de Reação (16). Em uma falha, fica temporariamente Restringida pela muralha."},{"n":"Exército Sombrio","tipo":"Feitiço","lvl":8,"rec":2,"t":"Uma vez por descanso longo, em um sucesso, você pode invocar um grupo de demônios que cercam você e se movem com você. Coloque 8 marcadores nesta carta. Quando você causa dano a um alvo em alcance Muito Próximo, pode gastar um marcador para aumentá-lo em +1d8. Além disso, quando você sofre dano, pode gastar um marcador para reduzi-lo em 1d8. Cada vez que você gasta um marcador, um demônio age em seu favor e então desaparece. Remova todos os marcadores desta carta no seu próximo descanso."},{"n":"Carne Nefanda","tipo":"Feitiço","lvl":8,"rec":1,"t":"Você encarna a escuridão com que flertou. Enquanto esta carta está no seu loadout: ganhe +1 nos seus limiares de dano para cada Estresse que você marcou; quando rolar com Medo, você pode gastar 2 Esperança para limpar um Compartimento de Armadura."},{"n":"Danação","tipo":"Feitiço","lvl":9,"rec":2,"t":"Faça um teste de Conjuração contra um alvo em alcance Distante. Em um sucesso, marque qualquer quantidade de Estresse para rolar uma quantidade igual de d20, causando dano mágico igual ao resultado total. Se o alvo for derrotado como resultado deste ataque, todos os adversários em alcance Distante do alvo marcam Estresse."},{"n":"Saborear a Angústia","tipo":"Feitiço","lvl":9,"rec":0,"t":"Quando um adversário em alcance Próximo marca Estresse ou sofre dano Grave, você pode gastar uma Esperança para limpar um Estresse ou forçar o mestre a perder um Medo."},{"n":"Invocar Tormento","tipo":"Feitiço","lvl":10,"rec":2,"t":"Alvos com todo o seu Estresse marcado sofrem o dobro de dano dos seus ataques. Além disso, quando você derrota uma criatura com todo o Estresse dela marcado, você limpa um Estresse."},{"n":"Avatar do Terror","tipo":"Feitiço","lvl":10,"rec":1,"t":"Marque Estresse para se transformar em uma criatura alimentada pelo medo. Nesta forma, suas rolagens de dano ganham +1d6 para cada Medo que o mestre tiver. Além disso, ganhe uma Esperança quando o mestre usar uma habilidade de Medo em um adversário em alcance Próximo. Você deve gastar uma Esperança para fazer um teste enquanto estiver nesta forma. Do contrário, você sai dela."}]};

/* ============ SINCRONIZAÇÃO COM O BANCO ============ */
const DB={on:false,ref:null,status:"local",ultimo:{},timers:{},pendente:false};
function dbStatus(s){ DB.status=s; const e=document.getElementById("dbst"); if(e){ e.textContent=({local:"◌ salvo só neste navegador",conectando:"… conectando ao banco",online:"☁ sincronizado com o banco",offline:"⚠ banco fora do ar — salvando local"})[s]||s; e.className="dbst "+s; } }
function dbInit(){
  if(!DB_CONFIG.databaseURL || !window.firebase){ dbStatus("local"); return; }
  try{
    firebase.initializeApp(DB_CONFIG);
    DB.ref=firebase.database().ref("mesas/"+MESA);
    DB.on=true; dbStatus("conectando");
    // primeira carga: banco manda; se o banco estiver vazio, sobe o que há no navegador
    DB.ref.child("fichas").once("value").then(snap=>{
      const remoto=snap.val();
      if(remoto && Object.keys(remoto).length){
        PJ=Object.values(remoto).map(normaliza);
        DB.ref.child("ordem").once("value").then(o=>{ const ord=o.val()||[]; PJ.sort((a,b)=>{ const ia=ord.indexOf(a.id), ib=ord.indexOf(b.id); return (ia<0?999:ia)-(ib<0?999:ib); }); BASE.forEach(b=>{ if(!PJ.some(p=>p.id===b.id)){ const n=normaliza(JSON.parse(JSON.stringify(b))); PJ.push(n); DB.ref.child("fichas/"+n.id).set(limpo(n)); } }); promoverFichasProntas().forEach(p=>DB.ref.child("fichas/"+p.id).set(limpo(p))); PJ.forEach(p=>DB.ultimo[p.id]=JSON.stringify(limpo(p))); PJ.forEach(saveOneLocal); saveIndexLocal(); if(cur>=PJ.length)cur=0; render(); });
      } else {
        PJ.forEach(p=>DB.ref.child("fichas/"+p.id).set(limpo(p)));
        DB.ref.child("ordem").set(PJ.map(p=>p.id));
      }
      dbStatus("online");
      // escuta mudanças de outros jogadores
      DB.ref.child("fichas").on("value",s=>{
        const r=s.val()||{}; let mudou=false;
        Object.keys(r).forEach(id=>{ const j=JSON.stringify(normaliza(r[id])); if(DB.ultimo[id]!==j){ DB.ultimo[id]=j; const i=PJ.findIndex(p=>p.id===id); const nova=normaliza(JSON.parse(j)); if(i>=0){ Object.keys(PJ[i]).forEach(k=>{ if(k[0]==="_") nova[k]=PJ[i][k]; }); PJ[i]=nova; } else PJ.push(nova); saveOneLocal(nova); mudou=true; } });
        PJ.forEach((p,i)=>{ if(!r[p.id] && DB.ultimo[p.id]!==undefined){ PJ.splice(i,1); lsDel(KEY_FICHA(p.id)); delete DB.ultimo[p.id]; mudou=true; } });
        if(mudou){ if(cur>=PJ.length)cur=Math.max(0,PJ.length-1); saveIndexLocal(); const a=document.activeElement; if(a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA"||a.isContentEditable)){ DB.pendente=true; } else render(); }
      });
      DB.ref.child("ordem").on("value",o=>{ const ord=o.val(); if(!Array.isArray(ord))return; PJ.sort((a,b)=>{ const ia=ord.indexOf(a.id), ib=ord.indexOf(b.id); return (ia<0?999:ia)-(ib<0?999:ib); }); });
      DB.ref.child("fotos").on("value",fs=>{ const r=fs.val()||{}; let mud=false;
        Object.keys(r).forEach(id=>{ if(FOTOS[id]!==r[id]){ FOTOS[id]=r[id]; lsSet(KEY_FOTO(id),r[id]); mud=true; } });
        Object.keys(FOTOS).forEach(id=>{ if(!(id in r)){ if(DB.fotosOk){ delete FOTOS[id]; lsDel(KEY_FOTO(id)); mud=true; } else DB.ref.child("fotos/"+id).set(FOTOS[id]); } });
        DB.fotosOk=true; if(mud) render(); });
      firebase.database().ref(".info/connected").on("value",s=>dbStatus(s.val()?"online":"offline"));
    }).catch(e=>{ console.error(e); dbStatus("offline"); });
  }catch(e){ console.error(e); dbStatus("local"); }
}
document.addEventListener("focusout",()=>{ if(DB.pendente){ DB.pendente=false; setTimeout(render,50); } });
function dbSave(p){
  if(!DB.on) return;
  const j=JSON.stringify(limpo(p)); DB.ultimo[p.id]=j;
  clearTimeout(DB.timers[p.id]);
  DB.timers[p.id]=setTimeout(()=>{ DB.ref.child("fichas/"+p.id).set(JSON.parse(j)).catch(()=>dbStatus("offline")); },250);
}
function dbIndex(){ if(DB.on) DB.ref.child("ordem").set(PJ.map(p=>p.id)); }
function dbRemove(id){ if(DB.on){ delete DB.ultimo[id]; DB.ref.child("fichas/"+id).remove(); dbIndex(); } }

/* ============ PERSISTÊNCIA (uma chave por ficha) ============ */
const KEY_IDX=KEY+"_idx";           // ordem das abas: ["dahlia","baine",...]
const KEY_FICHA=id=>KEY+"_ficha_"+id;
let MEM={};
function lsGet(k){ try{return localStorage.getItem(k);}catch(e){return MEM[k]??null;} }
function lsSet(k,v){ MEM[k]=v; try{localStorage.setItem(k,v);}catch(e){} }
function lsDel(k){ delete MEM[k]; try{localStorage.removeItem(k);}catch(e){} }
function limpo(o){ return JSON.parse(JSON.stringify(o,(k,v)=>(k[0]==="_")?undefined:v)); }
function saveOneLocal(p){ lsSet(KEY_FICHA(p.id),JSON.stringify(limpo(p))); }
function saveIndexLocal(){ lsSet(KEY_IDX,JSON.stringify(PJ.map(p=>p.id))); }
function saveOne(p){ saveOneLocal(p); dbSave(p); }
function saveIndex(){ saveIndexLocal(); dbIndex(); }
function saveAll(){ PJ.forEach(saveOne); saveIndex(); }
function normaliza(p){ if(p.pv==null)p.pv=0; if(p.fad==null)p.fad=0; if(p.esp==null)p.esp=2; if(p.arm==null)p.arm=0; if(!p.bolsa)p.bolsa=[]; if(!p.recursos)p.recursos=[]; if(p.notas==null)p.notas=[]; if(typeof p.notas==="string") p.notas=p.notas.trim()?[{titulo:"Anotações",texto:p.notas,data:new Date().toISOString().slice(0,10)}]:[]; if(!p.transFeats)p.transFeats=[]; if(!p.cartas)p.cartas=[]; if(!p.armaRes)p.armaRes="Nenhuma"; if(!p.experiencias)p.experiencias=[]; p.cartas.forEach(c=>{ if(c.mao==null)c.mao=true; }); if(typeof p.dominios==="string") p.dominios=p.dominios.split("&").map(s=>s.trim()); if(p.ativo==null)p.ativo=true; if(!p.atributos)p.atributos={}; ATRS.forEach(a=>{ if(p.atributos[a]==null)p.atributos[a]=0; }); ["ancFeats","comFeats","habilidades","subFeats","marcados","registro"].forEach(k=>{ if(!Array.isArray(p[k]))p[k]=[]; }); if(!p.ouro)p.ouro={punhados:0,bolsas:0,bau:0}; ["pronomes","jogador","conceito","ancNome","comNome","transNome","itens","subclasse","classe","conjuracao"].forEach(k=>{ if(p[k]==null)p[k]=""; }); if(p.ala===undefined)p.ala=null; if(!p.armaPrim)p.armaPrim=""; if(!p.armaSec)p.armaSec="Nenhuma"; if(!p.armadura)p.armadura=""; ["evasao","pvMax","fadigaMax","prof","limMenor","limGrave","armaduraMax"].forEach(k=>{ if(p[k]==null)p[k]={evasao:10,pvMax:6,fadigaMax:6,prof:1,limMenor:1,limGrave:2,armaduraMax:0}[k]; }); if(p.esperancaMax==null)p.esperancaMax=6; if(!p.nivel)p.nivel=1; return p; }
let PJ=[];
(function carregar(){
  let idx=null; try{ idx=JSON.parse(lsGet(KEY_IDX)||"null"); }catch(e){}
  if(!idx){
    // migração da versão antiga (tudo numa chave só)
    let velho=null; try{ velho=JSON.parse(lsGet(KEY)||"null"); }catch(e){}
    if(Array.isArray(velho)){ velho.forEach(p=>{ if(!p.id)p.id="pj_"+Math.random().toString(36).slice(2,8); }); PJ=velho; lsDel(KEY); }
    else PJ=JSON.parse(JSON.stringify(BASE));
    PJ.forEach(normaliza); saveAll(); return;
  }
  idx.forEach(id=>{ try{ const r=lsGet(KEY_FICHA(id)); if(r) PJ.push(normaliza(JSON.parse(r))); }catch(e){} });
  // fichas oficiais novas que ainda não existem neste navegador
  BASE.forEach(b=>{ if(!PJ.some(p=>p.id===b.id) && !idx.includes(b.id)){ PJ.push(normaliza(JSON.parse(JSON.stringify(b)))); saveOne(PJ[PJ.length-1]); } });
  saveIndex();
})();
/* ============ RETRATOS (guardados à parte da ficha, para não pesar cada salvamento) ============ */
const FOTOS={};
const KEY_FOTO=id=>KEY+"_foto_"+id;
function fotoDe(p){ return FOTOS[p.id]||FOTO_PADRAO[p.id]||null; }
PJ.forEach(p=>{ const f=lsGet(KEY_FOTO(p.id)); if(f) FOTOS[p.id]=f; });
function setFoto(p,data){
  if(data){ FOTOS[p.id]=data; lsSet(KEY_FOTO(p.id),data); } else { delete FOTOS[p.id]; lsDel(KEY_FOTO(p.id)); }
  if(DB.on) DB.ref.child("fotos/"+p.id).set(data||null).catch(()=>dbStatus("offline"));
  render();
}
function escolherFoto(p){
  const inp=document.createElement("input"); inp.type="file"; inp.accept="image/*";
  inp.onchange=()=>{ const f=inp.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{ const im=new Image();
      im.onload=()=>{ const MAX=760, k=Math.min(1,MAX/Math.max(im.width,im.height)); const cv=document.createElement("canvas"); cv.width=Math.round(im.width*k); cv.height=Math.round(im.height*k);
        const cx=cv.getContext("2d"); cx.fillStyle="#efe2c6"; cx.fillRect(0,0,cv.width,cv.height); cx.drawImage(im,0,0,cv.width,cv.height);
        setFoto(p,cv.toDataURL("image/jpeg",.82)); fecharLightbox(); toast("Retrato salvo"); };
      im.onerror=()=>alert("Não consegui ler essa imagem."); im.src=r.result; };
    r.readAsDataURL(f); };
  inp.click();
}
function fecharLightbox(){ const l=document.getElementById("lightbox"); if(l) l.remove(); }
function abrirLightbox(src,botoes){
  fecharLightbox(); const l=el("div","lightbox"); l.id="lightbox"; l.onclick=e=>{ if(e.target===l) fecharLightbox(); };
  const im=el("img"); im.src=src; im.alt=""; l.appendChild(im);
  const a=el("div","acts"); (botoes||[]).forEach(([t,cls,fn])=>{ const b=el("button",cls,t); b.onclick=fn; a.appendChild(b); });
  const f=el("button","g","fechar"); f.style.color="#efe2c6"; f.onclick=fecharLightbox; a.appendChild(f); l.appendChild(a); document.body.appendChild(l);
}
function promoverFichasProntas(){ // aba que estava "em criação" e agora vem pronta no arquivo
  let mud=[]; BASE.forEach(b=>{ if(!b.ativo) return; const i=PJ.findIndex(p=>p.id===b.id); if(i>=0 && !PJ[i].ativo){ PJ[i]=normaliza(JSON.parse(JSON.stringify(b))); mud.push(PJ[i]); } });
  return mud; }
promoverFichasProntas().forEach(p=>saveOneLocal(p));
function aplicarAla(p){ const a=p&&p.ala&&ALAS[p.ala], r=document.documentElement.style;
  if(a){ r.setProperty("--acc",a.cor); r.setProperty("--accd",a.corD); r.setProperty("--acc2",a.corL); } else { r.removeProperty("--acc"); r.removeProperty("--accd"); r.removeProperty("--acc2"); }
  document.querySelectorAll(".banners .bn").forEach(b=>b.classList.toggle("on",!!(p&&b.dataset.n===p.ala))); }

function toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("on");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("on"),1500);}
function ch(){ saveOne(PJ[cur]); render(); }
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;","&gt;":">",">":"&gt;",'"':"&quot;"}[c]));}
function fmtTexto(t,tipo){ // quebra listas e destaca os feitiços de um grimório
  let h=esc(t||"").replace(/ ?• /g,"<br>• ");
  if(tipo==="Grimório") h=h.replace(/(^|\. )([A-ZÀ-Ú][A-Za-zÀ-ú\- ]{2,30}): /g,(m,a,b)=>(a?".<br>":"")+"<b>"+b+":</b> ");
  return h;
}
function findEq(list,nome){ return list.find(x=>x.n===nome)||null; }
function patamar(n){ n=n||1; return n<=1?1:(n<=4?2:(n<=7?3:4)); }
function rnd(n){return Math.floor(Math.random()*n)+1;}
function sg(n){return (n>=0?"+":"")+n;}
function domColor(d){return DOM_CORES[d]||"#7f8b74";}

/* ============ REPOUSO ============ */
let REST={tipo:null,mv:[],log:""};
function aplicarRepouso(p){
  if(REST.mv.length<2){toast("Escolha 2 movimentos");return;}
  const pat=patamar(p.nivel); let log=[];
  REST.mv.forEach(id=>{
    if(id==="prep"){ p.esp=Math.min(p.esperancaMax,p.esp+2); log.push("Preparar-se: +2 Esperança"); }
    else if(id==="arm"){ const r=rnd(4)+pat; p.arm=Math.max(0,p.arm-r); log.push("Reparar Armadura 1d4+"+pat+" = "+r+" PA"); }
    else if(id==="fad"){ const r=rnd(4)+pat; p.fad=Math.max(0,p.fad-r); log.push("Reduzir Fadiga 1d4+"+pat+" = "+r+" PF"); }
    else if(id==="pv"){ const r=rnd(4)+pat; p.pv=Math.max(0,p.pv-r); log.push("Tratar Feridas 1d4+"+pat+" = "+r+" PV"); }
    else if(id==="armT"){ p.arm=0; log.push("Armadura totalmente reparada"); }
    else if(id==="pvT"){ p.pv=0; log.push("Todas as feridas tratadas"); }
    else if(id==="fadT"){ p.fad=0; log.push("Fadiga zerada"); }
    else if(id==="proj"){ log.push("Trabalhou em um projeto (anote o progresso)"); }
  });
  REST.log=(REST.tipo==="curto"?"DESCANSO CURTO — ":"DESCANSO LONGO — ")+log.join(" · ");
  REST.mv=[]; saveOne(p); render(); toast("Repouso aplicado");
}

/* ============ DADOS DE DUALIDADE ============ */
let DICE={atr:"Agilidade",exp:-1,mod:0,adv:0,last:null};
function rolar(p){
  const h=rnd(12), f=rnd(12);
  let mod=(p.atributos[DICE.atr]||0)+(DICE.mod||0);
  let det=["Esperança <b>"+h+"</b>","Medo <i>"+f+"</i>",DICE.atr+" "+sg(p.atributos[DICE.atr]||0)];
  if(DICE.exp>=0&&p.experiencias[DICE.exp]){ mod+=p.experiencias[DICE.exp].bonus; det.push("Exp. +"+p.experiencias[DICE.exp].bonus); }
  if(DICE.adv){ const d=rnd(6); mod+=DICE.adv*d; det.push((DICE.adv>0?"vantagem +":"desvantagem −")+d); }
  if(DICE.mod) det.push("mod "+sg(DICE.mod));
  const tot=h+f+mod;
  const tipo=h===f?"crit":(h>f?"hope":"fear");
  DICE.last={tot,tipo,det:det.join(" · ")};
  if(tipo==="hope"||tipo==="crit"){ p.esp=Math.min(p.esperancaMax,p.esp+1); }
  if(tipo==="crit"){ p.fad=Math.max(0,p.fad-1); }
  saveOne(p); render();
}

function pipRow(cls,n,val,onclick){
  const row=el("div","pips");
  for(let i=1;i<=n;i++){
    const p=el("div","pip "+cls+(i<=val?" on":""));
    p.title=i; p.onclick=()=>onclick(i===val?i-1:i);
    row.appendChild(p);
  }
  return row;
}
function tracker(titulo,cls,val,max,set,extra){
  const box=el("div","trk");
  const lb=el("div","lb"); lb.appendChild(el("b",null,titulo));
  lb.appendChild(el("span",null,(extra||"")+val+" / "+max));
  box.appendChild(lb);
  box.appendChild(pipRow(cls,max,val,v=>{set(v);ch();}));
  return box;
}
function numField(lbl,val,set,big){
  const d=el("div","st"+(big?" big":"")); d.appendChild(el("label",null,lbl));
  const i=el("input"); i.type="number"; i.value=val;
  i.onchange=()=>{set(parseInt(i.value)||0);ch();};
  d.appendChild(i); return d;
}
function featBlock(list,i,extraCls){
  const f=list[i];
  const box=el("div","feat"+(extraCls?" "+extraCls:""));
  if(f._ed){
    const n=el("input","tx"); n.value=f.n; n.placeholder="Nome"; n.oninput=()=>f.n=n.value; box.appendChild(n);
    const t=el("textarea"); t.value=f.t; t.placeholder="Texto"; t.oninput=()=>f.t=t.value; box.appendChild(t);
    const bts=el("div","bts");
    const ok=el("button","ok","✓ salvar"); ok.onclick=()=>{delete f._ed;ch();};
    const rm=el("button","rm","✕ remover"); rm.onclick=()=>{list.splice(i,1);ch();};
    bts.appendChild(ok); bts.appendChild(rm); box.appendChild(bts);
  } else {
    box.appendChild(el("b",null,esc(f.n)));

    const ed=el("button","ed","✎"); ed.title="editar"; ed.onclick=()=>{f._ed=true;render();}; box.appendChild(ed);

function featList(parent,titulo,list,extraCls){

/* ============ FICHA AINDA EM CRIAÇÃO ============ */
function carregarJSONNaAba(p){
  const inp=document.createElement("input"); inp.type="file"; inp.accept=".json,application/json";
  inp.onchange=()=>{ const f=inp.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{ try{ let d=JSON.parse(r.result); if(Array.isArray(d)) d=d[0]; if(!d||typeof d!=="object"||!d.classe) throw 0;
      d.id=p.id; d.ativo=true; if(!d.nome) d.nome=p.nome; const i=PJ.findIndex(x=>x.id===p.id); PJ[i]=normaliza(d); saveOne(PJ[i]); render(); toast("Ficha de "+PJ[i].nome+" carregada"); }catch(e){ alert("Esse arquivo não parece uma ficha gerada pelo criador."); } };
    r.readAsText(f); };
  inp.click();
}
function renderVazia(p,app){
  const c=el("div","card vazia");
  c.appendChild(el("div","nm",esc(p.nome)));
  c.appendChild(el("p",null,"Esta ficha ainda está em branco. Monte o personagem no <a href='criador.html'>criador de ficha</a>, toque em <b>Baixar para a ficha online</b> na última etapa e carregue o arquivo aqui. A aba é liberada para a mesa toda na hora."));

  const b1=el("button",null,"📂 Carregar ficha do criador (.json)"); b1.onclick=()=>carregarJSONNaAba(p); a.appendChild(b1);
  const b2=el("button","g",window._brancoArmado?"tocar de novo para confirmar":"começar ficha em branco");

  a.appendChild(b2); c.appendChild(a); app.appendChild(c);
}

  if(a){
    let base=a.corporal?3+(p.atributos["Força"]||0):a.base; if(s2&&s2.pa)base+=s2.pa;
    let lm,lg; if(a.corporal){ const T=[[9,19],[11,24],[13,31],[15,38]][pat-1]; lm=T[0];lg=T[1]; } else { lm=a.limMenor+p.nivel; lg=a.limGrave+p.nivel; }
    
    const ev=(a.ev||0)+(s2&&s2.ev?s2.ev:0)+(w1&&/–1 em Evasão|−1 em Evasão|-1 em Evasão|na Evasão/.test(w1.hab||"")?-1:0);
    const h=el("div","hint","Pelo equipamento: Armadura <b>"+base+"</b> · limiares <b>"+lm+"/"+lg+"</b> (base + nível"+") · Evasão base"+(ev?" <b>"+sg(ev)+"</b> pelo equipamento":" sem ajuste")+". Ajuste os campos acima se sua ficha usar outros valores.");
    const bt=el("button","add","aplicar valores sugeridos"); bt.onclick=()=>{p.armaduraMax=base;p.limMenor=lm;p.limGrave=lg;ch();toast("Valores aplicados");};
    c.appendChild(h); c.appendChild(bt);
  }
  c.appendChild(el("label","fl","Itens de classe"));
  const it=el("textarea"); it.value=p.itens||""; it.style.minHeight="56px"; it.onchange=()=>{p.itens=it.value;saveOne(p);}; c.appendChild(it);
  R.appendChild(c);

  // ---------- BOLSA + EXPERIÊNCIAS ----------
  c=el("div","card"); c.appendChild(el("h2",null,"Bolsa <small>"+p.bolsa.length+" itens</small>"));
  const lst=el("div","lst");
  p.bolsa.forEach((b,i)=>{
    const row=el("div","it");
    const n=el("input","tx"); n.value=b.nome; n.placeholder="item"; n.onchange=()=>{b.nome=n.value;saveOne(p);};
    const q=el("input","tx n"); q.type="number"; q.value=b.qtd; q.onchange=()=>{b.qtd=parseInt(q.value)||0;saveOne(p);};
    const x=el("button",null,"✕"); x.onclick=()=>{p.bolsa.splice(i,1);ch();};
    row.appendChild(n);row.appendChild(q);row.appendChild(x); lst.appendChild(row);
  });
  c.appendChild(lst);
  const addb=el("button","add","+ adicionar item"); addb.onclick=()=>{p.bolsa.push({nome:"",qtd:1});ch();}; c.appendChild(addb);
  c.appendChild(el("h2",null,"Ouro <small>10 punhados = 1 bolsa · 10 bolsas = 1 baú</small>")).style.marginTop="16px";
  c.appendChild(tracker("Punhados","ouro",p.ouro.punhados,9,v=>p.ouro.punhados=v,""));
  c.appendChild(tracker("Bolsas","ouro",p.ouro.bolsas,9,v=>p.ouro.bolsas=v,""));
  c.appendChild(tracker("Baú","ouro",p.ouro.bau,1,v=>p.ouro.bau=v,""));
  c.appendChild(el("h2",null,"Experiências")).style.marginTop="16px";
  const le=el("div","lst");
  p.experiencias.forEach((e,i)=>{
    const row=el("div","it");
    const n=el("input","tx"); n.value=e.nome; n.onchange=()=>{e.nome=n.value;saveOne(p);};
    const q=el("input","tx n"); q.type="number"; q.value=e.bonus; q.onchange=()=>{e.bonus=parseInt(q.value)||2;saveOne(p);};
    const x=el("button",null,"✕"); x.onclick=()=>{p.experiencias.splice(i,1);ch();};
    row.appendChild(n);row.appendChild(q);row.appendChild(x); le.appendChild(row);
  });
  c.appendChild(le);
  const ae=el("button","add","+ nova experiência"); ae.onclick=()=>{p.experiencias.push({nome:"",bonus:2});ch();}; c.appendChild(ae);
  R.appendChild(c);

  // ---------- CARTAS ----------
  c=el("div","card");
  const naMao=p.cartas.filter(x=>x.mao).length;
  c.appendChild(el("h2",null,"Cartas de Domínio <small>"+naMao+" na mão · "+(p.cartas.length-naMao)+" na reserva</small>"));
  if(naMao>5) c.appendChild(el("div","hint","<b>Mão acima do limite:</b> o livro permite até 5 cartas na mão (Notoriedade não conta). Mande alguma para a reserva."));
  const cf=el("div","cfilter");
  [["all","todas"],["mao","na mão"],["res","reserva"]].forEach(([k,t])=>{const b=el("button",(p._cf||"all")===k?"on":"",t); b.onclick=()=>{p._cf=k;render();}; cf.appendChild(b);});
  c.appendChild(cf);
  p.cartas.forEach((cd,i)=>{
    const f=p._cf||"all"; if(f==="mao"&&!cd.mao)return; if(f==="res"&&cd.mao)return;
    const box=el("div","carta"+(cd.mao?"":" reserva")); box.style.borderLeftColor=domColor(cd.dom);
    if(cd._ed){
      const g=el("div","edg");
      const dm=el("select"); Object.keys(CARDS).forEach(d=>{const o=el("option",null,d);o.value=d;if(cd.dom===d)o.selected=true;dm.appendChild(o);}); const oo=el("option",null,"Outro");oo.value="";if(!CARDS[cd.dom])oo.selected=true;dm.appendChild(oo); dm.onchange=()=>cd.dom=dm.value;
      const tp=el("select"); ["Talento","Feitiço","Grimório"].forEach(o=>{const op=el("option",null,o);op.value=o;if(cd.tipo===o)op.selected=true;tp.appendChild(op);}); tp.onchange=()=>cd.tipo=tp.value;
      const lv=el("input","tx"); lv.type="number"; lv.placeholder="Nível"; lv.value=cd.lvl||1; lv.oninput=()=>cd.lvl=parseInt(lv.value)||1;
      const rc=el("input","tx"); rc.type="number"; rc.placeholder="Rec."; rc.value=cd.rec!=null?cd.rec:1; rc.oninput=()=>cd.rec=parseInt(rc.value)||0;
      g.appendChild(dm); g.appendChild(tp); g.appendChild(lv); g.appendChild(rc); box.appendChild(g);
      const nm=el("input","tx"); nm.placeholder="Nome da carta"; nm.value=cd.n||""; nm.oninput=()=>cd.n=nm.value; box.appendChild(nm);
      const tx=el("textarea"); tx.placeholder="Texto da carta"; tx.value=cd.t||""; tx.style.marginTop="6px"; tx.oninput=()=>cd.t=tx.value; box.appendChild(tx);
      const bts=el("div","bts");
      const ok=el("button","ok","✓ salvar"); ok.onclick=()=>{delete cd._ed;ch();toast("Carta salva");};
      const rm=el("button","rm","✕ remover"); rm.onclick=()=>{p.cartas.splice(i,1);ch();};
      bts.appendChild(ok); bts.appendChild(rm); box.appendChild(bts);
    } else {
      const tg=el("div","tg"); tg.innerHTML="<span style='color:"+domColor(cd.dom)+"'>"+(DOM_ICON[cd.dom]||"")+" "+esc(cd.dom||"—")+" · "+esc(cd.tipo||"—")+"</span><span>nv "+(cd.lvl||"?")+" · rec "+(cd.rec!=null?cd.rec:"—")+(cd.mao?"":" · reserva")+"</span>";
      box.appendChild(tg);
      box.appendChild(el("b","nm",esc(cd.n||"(sem nome)")));
      box.appendChild(el("p",null,fmtTexto(cd.t,cd.tipo)));
      const bts=el("div","bts");
      const mv=el("button",cd.mao?"":"ok",cd.mao?"→ reserva":"→ mão"); mv.onclick=()=>{cd.mao=!cd.mao;ch();};
      const ed=el("button",null,"✎ editar"); ed.onclick=()=>{cd._ed=true;render();};
      const rm=el("button","rm","✕"); rm.onclick=()=>{if(confirm("Remover "+cd.n+"?")){p.cartas.splice(i,1);ch();}};
      bts.appendChild(mv); bts.appendChild(ed); bts.appendChild(rm); box.appendChild(bts);
    }
    c.appendChild(box);
  });
  const ac=el("button","add",p._pick?"× fechar lista":"+ escolher carta de domínio"); ac.onclick=()=>{p._pick=!p._pick;render();}; c.appendChild(ac);
  if(p._pick){
    const bar=el("div","pickbar");
    const q=el("input","tx"); q.placeholder="buscar carta…"; q.value=p._q||""; q.oninput=()=>{p._q=q.value;renderPick();}; bar.appendChild(q);
    const lbAll=el("label"); const cb2=el("input"); cb2.type="checkbox"; cb2.checked=!!p._allDom; cb2.onchange=()=>{p._allDom=cb2.checked;renderPick();}; lbAll.appendChild(cb2); lbAll.appendChild(document.createTextNode("todos os domínios")); bar.appendChild(lbAll);
    c.appendChild(bar);
    const box=el("div","pick"); c.appendChild(box);
    function renderPick(){
      box.innerHTML=""; let n=0;
      const doms=p._allDom?Object.keys(CARDS):p.dominios;
      const qq=(p._q||"").toLowerCase();
      doms.forEach(d=>{
        (CARDS[d]||[]).filter(x=>(x.lvl||1)<=p.nivel).forEach(x=>{
          if(p.cartas.some(k=>(k.n||"").toLowerCase()===x.n.toLowerCase())) return;
          if(qq&&!(x.n.toLowerCase().includes(qq)||x.t.toLowerCase().includes(qq))) return;
          n++;
          const o=el("div","op"); o.style.borderLeftColor=domColor(d);
          o.appendChild(el("div","tg",(DOM_ICON[d]||"")+" "+d+" · "+x.tipo+" · nível "+x.lvl+" · recordação "+x.rec));
          o.appendChild(el("b",null,esc(x.n)));
          o.appendChild(el("p",null,fmtTexto(x.t,x.tipo)));
          o.onclick=()=>{p.cartas.push({dom:d,tipo:x.tipo,rec:x.rec,lvl:x.lvl,n:x.n,t:x.t,mao:true});p._pick=false;ch();toast("Carta adicionada à mão");};
          box.appendChild(o);
        });
      });
      if(!n) box.appendChild(el("div","hint","Nenhuma carta disponível até o nível "+p.nivel+" em "+doms.join(" e ")+". Suba o nível, marque “todos os domínios” ou crie uma carta manualmente."));
    }
    renderPick();
    const man=el("button","add","+ criar carta manualmente"); man.onclick=()=>{p.cartas.push({dom:p.dominios[0]||"",tipo:"Talento",rec:1,lvl:p.nivel,n:"",t:"",mao:true,_ed:true});p._pick=false;render();}; c.appendChild(man);
  }
  c.appendChild(el("div","hint","<b>Recordação</b> é o custo em Fadiga para trocar uma carta da reserva para a mão fora do repouso. No repouso a troca é gratuita."));
  R.appendChild(c);

  // ---------- ALA ----------
  c=el("div","card"); c.appendChild(el("h2",null,"Estandarte de origem <small>a bandeira que ficou para trás</small>"));
  const sAla=el("select"); [["","Sem estandarte"],...Object.keys(ALAS).map(k=>[k,ALAS[k].titulo])].forEach(([v,t])=>{ const o=el("option",null,t); o.value=v; if((p.ala||"")===v) o.selected=true; sAla.appendChild(o); });
  sAla.setAttribute("aria-label","Estandarte de origem"); sAla.onchange=()=>{ p.ala=sAla.value||null; ch(); }; c.appendChild(sAla);
  if(p.ala&&ALAS[p.ala]){ const A=ALAS[p.ala]; const box=el("div","alacard"); box.style.marginTop="12px";
    const im=el("img"); im.src=A.img; im.alt="Pendão de "+A.titulo; im.onclick=()=>abrirLightbox(A.img); box.appendChild(im);
    const tx=el("div"); A.feats.forEach(f=>{ const d=el("div","feat"); d.appendChild(el("b",null,esc(f.n))); d.appendChild(el("p",null,fmtTexto(f.t))); tx.appendChild(d); });
    if(A.recurso && !p.recursos.some(r=>r.nome===A.recurso)){ const br=el("button","add","+ contador de "+A.recurso); br.onclick=()=>{ p.recursos.push({nome:A.recurso,val:0,max:0}); ch(); toast("Contador criado em Estado"); }; tx.appendChild(br); }
    box.appendChild(tx); c.appendChild(box); }
  c.appendChild(el("div","hint","A Sociedade Sem Bandeiras não serve a estandarte nenhum. Este é o de onde você veio: ele dá a cor da ficha e diz o que a sua nação espera — ou cobra — de você."));
  R.appendChild(c);

  // ---------- IDENTIDADE & HABILIDADES ----------
  c=el("div","card"); c.appendChild(el("h2",null,"Identidade & Habilidades <small>✎ para editar</small>"));
  featList(c,"Ancestralidade — "+esc(p.ancNome),p.ancFeats);
  featList(c,"Comunidade — "+esc(p.comNome),p.comFeats);
  if(p.transNome||p.transFeats.length) featList(c,"Transformação — "+esc(p.transNome||"—"),p.transFeats,"trans");
  featList(c,"Habilidades de classe — "+esc(p.classe),p.habilidades);
  featList(c,"Subclasse — "+esc(p.subclasse),p.subFeats);
  featList(c,"Registro de evolução",p.registro);
  R.appendChild(c);

  // ---------- NOTAS ----------
  c=el("div","card"); c.appendChild(el("h2",null,"Anotações de sessão <small>"+p.notas.length+" nota(s)</small>"));
  const bn=el("button","add","+ nova anotação"); bn.onclick=()=>{ p.notas.unshift({titulo:"",texto:"",data:new Date().toISOString().slice(0,10),_ed:true}); render(); }; c.appendChild(bn);
  p.notas.forEach((n,i)=>{
    const box=el("div","nota");
    if(n._ed){
      const tt=el("input","tx"); tt.placeholder="Título (ex.: Sessão 4 — a torre)"; tt.value=n.titulo||""; tt.oninput=()=>n.titulo=tt.value; box.appendChild(tt);
      const tx=el("textarea"); tx.placeholder="Pistas, contatos, dívidas, o que o Caim não contou…"; tx.value=n.texto||""; tx.style.minHeight="110px"; tx.style.marginTop="6px"; tx.oninput=()=>n.texto=tx.value; box.appendChild(tx);
      const bts=el("div","bts");
      const ok=el("button","ok","✓ salvar"); ok.onclick=()=>{ if(!n.titulo.trim()) n.titulo="Anotação "+n.data; delete n._ed; ch(); toast("Anotação salva"); };
      const cn=el("button",null,"cancelar"); cn.onclick=()=>{ if(!n.titulo&&!n.texto){ p.notas.splice(i,1);} else delete n._ed; render(); };
      const rm=el("button","rm","✕ excluir"); rm.onclick=()=>{ if(confirm("Excluir esta anotação?")){ p.notas.splice(i,1); ch(); } };
      bts.appendChild(ok); bts.appendChild(cn); bts.appendChild(rm); box.appendChild(bts);
      if(!n.titulo&&!n.texto) setTimeout(()=>tt.focus(),0);
    } else {
      const hd=el("div","hd"); hd.appendChild(el("b",null,esc(n.titulo))); hd.appendChild(el("span",null,esc(n.data||""))); box.appendChild(hd);
      box.appendChild(el("p",null,esc(n.texto)));
      const bts=el("div","bts");
      const ed=el("button",null,"✎ editar"); ed.onclick=()=>{ n._ed=true; render(); };
      const rm=el("button","rm","✕ excluir"); rm.onclick=()=>{ if(confirm("Excluir \""+n.titulo+"\"?")){ p.notas.splice(i,1); ch(); } };
      bts.appendChild(ed); bts.appendChild(rm); box.appendChild(bts);
    }
    c.appendChild(box);
  });
  if(!p.notas.length) c.appendChild(el("div","hint","Nenhuma anotação ainda. Use <b>nova anotação</b> pra registrar pistas, contatos e dívidas — cada nota tem data e pode ser editada depois."));
  R.appendChild(c);

  // ---------- BACKUP ----------
  c=el("div","card"); c.appendChild(el("h2",null,"Backup & impressão"));
  const acts=el("div","acts");
  function baixar(obj,nome){ const b=new Blob([JSON.stringify(obj,null,1)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=nome; a.click(); }
  const bj=el("button",null,"💾 Baixar esta ficha (JSON)"); bj.onclick=()=>baixar(limpo(p),"ficha-"+(p.nome||p.id).toLowerCase().replace(/[^a-z0-9]+/gi,"-")+".json"); acts.appendChild(bj);
  const bja=el("button","g","💾 Baixar todas"); bja.onclick=()=>baixar(PJ.map(limpo),"sociedade-sem-bandeiras-fichas.json"); acts.appendChild(bja);
  const bi=el("button","g","📂 Carregar JSON"); bi.onclick=()=>{
    const inp=document.createElement("input"); inp.type="file"; inp.accept=".json,application/json";
    inp.onchange=()=>{const f=inp.files[0]; if(!f)return; const r=new FileReader();
      r.onload=()=>{try{ let d=JSON.parse(r.result); if(!Array.isArray(d)) d=[d]; let n=0;
        d.forEach(x=>{ if(!x||typeof x!=="object"||!x.nome) return; normaliza(x); if(!x.id) x.id="pj_"+Math.random().toString(36).slice(2,8);
          let i=PJ.findIndex(q=>q.id===x.id); if(i<0) i=PJ.findIndex(q=>(q.nome||"").toLowerCase()===x.nome.toLowerCase());
          if(i>=0){ x.id=PJ[i].id; PJ[i]=x; } else PJ.push(x); n++; });
        saveAll(); toast(n+" ficha(s) carregada(s)"); render(); }catch(e){alert("Arquivo inválido");}};
      r.readAsText(f);}; inp.click();};
  acts.appendChild(bi);
  if(!BASE.some(b=>b.id===p.id)){ const bdel=el("button","d","🗑 Remover esta ficha"); bdel.onclick=()=>{ if(confirm("Remover a ficha de "+p.nome+"? Isso não pode ser desfeito.")){ lsDel(KEY_FICHA(p.id)); dbRemove(p.id); PJ.splice(cur,1); cur=Math.max(0,cur-1); saveIndex(); render(); } }; acts.appendChild(bdel); }
  const bpr=el("button","g","🖨 Imprimir"); bpr.onclick=()=>window.print(); acts.appendChild(bpr);
  const br=el("button","d",window._resetArmado?"⚠ tocar de novo para confirmar":"↺ Restaurar esta ficha");
  br.onclick=()=>{
    if(!window._resetArmado){window._resetArmado=true;render();setTimeout(()=>{window._resetArmado=false;render();},4000);return;}
    window._resetArmado=false;
    const b=BASE.find(x=>x.id===p.id); if(b){ PJ[cur]=normaliza(JSON.parse(JSON.stringify(b))); }
    saveOne(PJ[cur]);toast("Ficha restaurada");render();};
  acts.appendChild(br);
  c.appendChild(acts);
  c.appendChild(el("div","hint","As fichas ficam no banco da mesa: toda mudança é salva na hora e aparece ao vivo para quem estiver com a página aberta. Sem internet, a ficha continua funcionando e guarda tudo neste navegador. <b>Carregar JSON</b> aceita o arquivo gerado pelo criador de ficha (botão “Baixar para a ficha online”) e os backups baixados aqui; se o nome bater com uma aba existente, ele substitui essa aba. Use <b>Baixar esta ficha</b> no fim da sessão como backup."));
  R.appendChild(c);
}
render();
dbInit();
</script>
</body>
</html>
